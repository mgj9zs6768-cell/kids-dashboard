<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="등원 대시보드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F8FE">
<title>유주·유현 등원 대시보드</title>
<style>
  :root{
    --ink:#16203C;
    --ink-soft:#5F6B8A;
    --ink-mute:#93A0BB;
    --line:#E6EDF9;
    --card:#FFFFFF;
    --g:clamp(6px, 1.1vh, 14px);
    --r-lg:clamp(18px, 2.2vh, 28px);
    --shadow:0 18px 40px -18px rgba(24,42,86,.30), 0 4px 14px -6px rgba(24,42,86,.10);
    --shadow-sm:0 8px 20px -12px rgba(24,42,86,.28);
    --calm:#0FB57F;
    --calm-soft:rgba(15,181,127,.13);
    --warn:#F08C00;
    --warn-soft:rgba(240,140,0,.14);
    --hurry:#EF3B4E;
    --hurry-soft:rgba(239,59,78,.14);
    --late:#E0483F;
    --late-soft:rgba(224,72,63,.13);
    --done:#7C89A8;
    --done-soft:rgba(124,137,168,.13);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }

  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Helvetica Neue", Arial, "Liberation Sans", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 6% -12%, #E3F2FF 0%, rgba(227,242,255,0) 62%),
      radial-gradient(900px 560px at 102% -6%, #FFEFE3 0%, rgba(255,239,227,0) 58%),
      radial-gradient(1000px 700px at 50% 118%, #E4FBF0 0%, rgba(228,251,240,0) 62%),
      #F6F9FE;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  body::before, body::after{
    content:"";
    position:fixed; z-index:0; border-radius:50%; filter:blur(46px); opacity:.55; pointer-events:none;
  }
  body::before{ width:34vw; height:34vw; left:-10vw; top:38vh; background:radial-gradient(circle,#BFE6FF,transparent 70%); }
  body::after{ width:30vw; height:30vw; right:-8vw; bottom:-6vw; background:radial-gradient(circle,#FFE2C2,transparent 70%); }

  .app{
    position:relative; z-index:1;
    height:100vh;
    height:100dvh;
    display:flex; flex-direction:column;
    padding:clamp(6px, 1.1vh, 14px) clamp(12px, 2vw, 30px) clamp(8px, 1.3vh, 16px);
    max-width:1560px; margin:0 auto;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:var(--g);
    min-height:clamp(34px, 5vh, 46px);
  }
  .date-block{ display:flex; align-items:baseline; gap:clamp(8px,1.2vw,16px); min-width:0; }
  .date-txt{
    font-size:clamp(14px, 1.8vh, 21px); font-weight:800; color:var(--ink-soft);
    letter-spacing:-.01em; white-space:nowrap;
  }
  .clock-txt{
    font-size:clamp(20px, 3vh, 32px); font-weight:800; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; white-space:nowrap;
  }
  .toolbar{ display:flex; align-items:center; gap:clamp(5px,.6vw,9px); position:relative; }
  .chip{
    font-family:inherit; font-size:clamp(11px, 1.4vh, 15px); font-weight:800; color:var(--ink-soft);
    background:rgba(255,255,255,.82); border:1.5px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow-sm);
    border-radius:999px; padding:clamp(6px,.8vh,10px) clamp(9px,1vw,15px);
    cursor:pointer; white-space:nowrap;
    transition:transform .12s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .chip:active{ transform:scale(.95); }
  .chip.accent{ color:#fff; background:linear-gradient(135deg,#3F86F7,#5A6BF0); border-color:transparent; }
  .chip.active{ color:#fff; background:linear-gradient(135deg,#8A5CF6,#B15CF6); border-color:transparent; }
  @media (hover:hover){ .chip:hover{ background:#fff; color:var(--ink); } .chip.accent:hover,.chip.active:hover{ color:#fff; } }

  /* ---------- timer hero ---------- */
  .timer{
    --state:var(--calm); --state-soft:var(--calm-soft);
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,#FFFFFF 0%,#FFFFFF 52%,var(--state-soft) 100%);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow);
    border:1.5px solid rgba(255,255,255,.95);
    padding:clamp(7px, 1.1vh, 14px) clamp(14px, 2vw, 26px) clamp(8px, 1.2vh, 14px);
    display:flex; flex-direction:column; gap:clamp(2px,.5vh,7px);
    margin-bottom:var(--g);
    transition:background .6s ease, box-shadow .6s ease;
  }
  .timer[data-phase="warn"]{ --state:var(--warn); --state-soft:var(--warn-soft); }
  .timer[data-phase="hurry"]{ --state:var(--hurry); --state-soft:var(--hurry-soft); }
  .timer[data-phase="leave"]{ --state:var(--late); --state-soft:var(--late-soft); }
  .timer[data-phase="late"]{ --state:var(--late); --state-soft:var(--late-soft); }
  .timer[data-phase="done"]{ --state:var(--done); --state-soft:var(--done-soft); }
  .timer[data-phase="hurry"]{ animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ box-shadow:var(--shadow); }
    50%{ box-shadow:0 18px 44px -16px rgba(239,59,78,.45), 0 0 0 4px rgba(239,59,78,.10); }
  }
  .t-top{ display:flex; align-items:center; gap:8px; min-height:0; }
  .badge{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    background:var(--state-soft); color:var(--state);
    font-size:clamp(12px, 1.6vh, 18px); font-weight:900;
    padding:clamp(4px,.6vh,7px) clamp(10px,1vw,15px);
    border-radius:999px; transition:background .5s ease,color .5s ease;
    letter-spacing:-.01em; white-space:nowrap;
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.35; transform:scale(.8);} }
  .t-hint{
    flex:1 1 auto; min-width:0;
    font-size:clamp(11px,1.5vh,16px); font-weight:700; color:var(--ink-soft);
    text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .t-hint b{ color:var(--ink); font-weight:800; }
  .depart{ flex:0 0 auto; font-size:clamp(11px,1.5vh,16px); font-weight:800; color:var(--ink-mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .preview-flag{
    flex:0 0 auto; font-size:clamp(10px,1.3vh,13px); font-weight:900; color:#fff;
    background:linear-gradient(135deg,#8A5CF6,#C15CF6); border-radius:999px; padding:3px 9px;
  }
  .t-count{ display:flex; align-items:baseline; gap:clamp(7px,.9vw,13px); }
  .count{
    font-size:clamp(32px, min(8.2vw, 10.4vh), 100px);
    line-height:.94; font-weight:900; letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    color:var(--state);
    transition:color .5s ease;
    text-shadow:0 10px 26px var(--state-soft);
  }
  .count-label{ font-size:clamp(12px,1.7vh,19px); font-weight:800; color:var(--ink-mute); }
  .track{
    position:relative; height:clamp(10px, 1.6vh, 17px);
    background:#EDF2FA; border-radius:999px; box-shadow:inset 0 1px 3px rgba(24,42,86,.08);
  }
  .fill{
    position:relative; height:100%; width:100%;
    border-radius:999px;
    background-image:linear-gradient(90deg, var(--state) 0%, var(--state) 100%);
    transition:width .45s linear, background .5s ease;
    overflow:hidden;
  }
  .fill::after{
    content:""; position:absolute; inset:0;
    background-image:linear-gradient(90deg, rgba(255,255,255,0) 0 52%, rgba(255,255,255,.34) 52% 100%);
    background-size:30px 100%;
    animation:slide 1.1s linear infinite;
    opacity:.9;
  }
  @keyframes slide{ from{ background-position:0 0; } to{ background-position:30px 0; } }
  .rocket{
    position:absolute; top:50%; left:100%;
    transform:translate(-50%,-50%);
    font-size:clamp(13px,1.9vh,22px);
    transition:left .45s linear;
    filter:drop-shadow(0 3px 6px rgba(24,42,86,.22));
    pointer-events:none;
  }

  /* ---------- all done banner ---------- */
  .all-done{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:var(--g);
    padding:clamp(6px,1vh,12px) clamp(12px,2vw,22px);
    border-radius:var(--r-lg);
    background:linear-gradient(100deg,#7BF1C0,#8FD8FF 45%,#FFD9A5);
    box-shadow:0 16px 34px -18px rgba(30,180,150,.7), 0 0 0 1.5px rgba(255,255,255,.7) inset;
    font-size:clamp(14px,1.95vh,23px); font-weight:900; letter-spacing:-.02em; color:#0E3532;
    animation:bannerIn .55s cubic-bezier(.2,.9,.3,1.35);
  }
  .all-done .ad-emoji{ font-size:clamp(18px,2.5vh,29px); animation:bob 1.4s ease-in-out infinite; }
  @keyframes bannerIn{ from{ opacity:0; transform:translateY(-14px) scale(.96);} to{ opacity:1; transform:none;} }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-5px) rotate(4deg);} }

  /* ---------- kids ---------- */
  .kids{
    flex:1 1 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:var(--g);
    min-height:0;
  }
  .kid{
    position:relative; min-height:0;
    display:flex; flex-direction:column;
    background:var(--card);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow);
    border:1.5px solid rgba(255,255,255,.95);
    padding:clamp(7px,1.1vh,13px) clamp(9px,1.1vw,16px) clamp(8px,1.2vh,14px);
    transition:box-shadow .4s ease;
    overflow:hidden;
  }
  .kid::before{
    content:""; position:absolute; inset:0 0 auto 0; height:clamp(4px,.7vh,7px);
    background:linear-gradient(90deg, var(--k1), var(--k2));
  }
  .kid[data-theme="sky"]{ --k1:#34A9F5; --k2:#2FD3A8; --k-soft:rgba(52,169,245,.10); --k-soft2:rgba(52,169,245,.20); --k-deep:#1479C4; }
  .kid[data-theme="coral"]{ --k1:#FF8A5B; --k2:#FFC93C; --k-soft:rgba(255,138,91,.10); --k-soft2:rgba(255,138,91,.20); --k-deep:#D2622F; }
  .kid.complete{ box-shadow:0 0 0 3px var(--k-soft2), var(--shadow); }

  .kid-head{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center;
    gap:clamp(7px,.9vw,12px);
    padding-bottom:clamp(4px,.7vh,9px);
    min-width:0;
  }
  .avatar{
    position:relative;
    width:clamp(30px,4.3vh,50px); height:clamp(30px,4.3vh,50px);
    border-radius:28%;
    display:grid; place-items:center;
    background:linear-gradient(140deg, var(--k-soft2), #ffffff);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9), 0 6px 14px -8px var(--k1);
    font-size:clamp(19px,2.9vh,33px); line-height:1;
  }
  .kid-title{ min-width:0; display:flex; align-items:baseline; gap:7px; }
  .kid-name{
    margin:0; font-size:clamp(17px,2.6vh,30px); font-weight:900; letter-spacing:-.03em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .kid-order{ font-size:clamp(10px,1.3vh,13px); font-weight:800; color:var(--k-deep); opacity:.7; white-space:nowrap; }
  .kid-count{
    display:flex; align-items:baseline; gap:4px;
    font-size:clamp(11px,1.5vh,16px); font-weight:800; color:var(--ink-mute);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .kid-count b{ color:var(--k-deep); font-size:1.3em; }
  .kid-bar{ flex:0 0 auto; width:100%; height:clamp(5px,.8vh,8px); background:#EEF2FA; border-radius:999px; overflow:hidden; margin-bottom:clamp(5px,.8vh,10px); }
  .kid-bar i{
    display:block; height:100%; width:0;
    background:linear-gradient(90deg,var(--k1),var(--k2));
    border-radius:999px; transition:width .45s cubic-bezier(.3,.9,.3,1);
  }
  .done-badge{
    position:absolute; right:-6px; bottom:-6px;
    font-size:clamp(12px,1.7vh,18px); line-height:1;
    display:grid; place-items:center;
    background:#fff; border-radius:50%; padding:1px 2px;
    box-shadow:0 3px 8px -2px rgba(24,42,86,.35);
    animation:badgeIn .5s cubic-bezier(.2,.9,.3,1.5);
  }
  @keyframes badgeIn{ from{ opacity:0; transform:scale(.3) rotate(-30deg);} to{ opacity:1; transform:none;} }

  /* ---------- picture cards ---------- */
  .cards{
    flex:1 1 auto; min-height:0; min-width:0;
    display:grid;
    grid-template-columns:repeat(var(--cols,3), minmax(0,1fr));
    grid-template-rows:repeat(var(--rows,2), minmax(0,1fr));
    gap:clamp(5px,.9vh,10px);
    overflow:hidden;
  }
  .pic{
    position:relative; min-width:0; min-height:0; overflow:hidden;
    font-family:inherit; border:none; padding:0; margin:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    background:#fff;
    border-radius:clamp(13px,1.9vh,20px);
    box-shadow:0 7px 18px -14px rgba(24,42,86,.65), inset 0 0 0 1.5px #EEF3FB;
    transition:background .25s ease, box-shadow .25s ease, transform .12s ease;
    -webkit-appearance:none; appearance:none;
  }
  .pic:active{ transform:scale(.965); }
  .pic-media{
    position:relative; flex:1 1 auto; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(2px,.5vh,6px) clamp(2px,.5vw,7px) 0;
    transition:opacity .3s ease, filter .3s ease, transform .3s ease;
  }
  .pic-media img{
    width:100%; height:100%; object-fit:contain; object-position:center; display:block;
    border-radius:clamp(8px,1.2vh,12px);
  }
  .pic-media .em{ font-size:clamp(26px,5.4vh,56px); line-height:1; }
  .pic-label{
    flex:0 0 auto; max-width:100%;
    padding:0 clamp(3px,.4vw,7px) clamp(4px,.7vh,8px);
    font-size:clamp(13px,2vh,21px); font-weight:900; letter-spacing:-.035em;
    color:var(--ink); line-height:1.18;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .25s ease;
  }
  .pic-tint{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(160deg, var(--k-soft), var(--k-soft));
    opacity:0; transition:opacity .35s ease;
  }
  .pic.on .pic-tint{ opacity:1; }
  .pic.on{ box-shadow:inset 0 0 0 2.5px var(--k1), 0 10px 24px -16px rgba(24,42,86,.7); }
  .pic.on .pic-media{ opacity:.66; filter:saturate(.72); transform:scale(.93); }
  .pic.on .pic-label{ color:#8b97b0; }
  .pic-badge{
    position:absolute; left:50%; top:calc(50% - clamp(6px,1vh,10px));
    transform:translate(-50%,-50%) scale(.2) rotate(-30deg);
    width:clamp(40px,6.6vh,66px); height:clamp(40px,6.6vh,66px); border-radius:50%;
    display:grid; place-items:center;
    background:linear-gradient(150deg,#2FD98B,#0FAE74);
    color:#fff; font-size:clamp(22px,3.8vh,38px); font-weight:900; line-height:1;
    box-shadow:0 10px 24px -8px rgba(15,174,116,.85), 0 0 0 clamp(3px,.5vh,5px) rgba(255,255,255,.95);
    opacity:0; pointer-events:none;
  }
  .pic.on .pic-badge{ animation:badgePop .6s cubic-bezier(.2,.9,.3,1.5) forwards; }
  .pic-badge::before, .pic-badge::after{
    content:"✨"; position:absolute; font-size:clamp(13px,2vh,22px); opacity:0;
  }
  .pic-badge::before{ right:-52%; top:-38%; }
  .pic-badge::after{ content:"✦"; left:-52%; bottom:-30%; color:#FFD84D; }
  .pic.on .pic-badge::before{ animation:sparkle 1.1s ease-out .22s infinite; }
  .pic.on .pic-badge::after{ animation:sparkle 1.3s ease-out .38s infinite; }
  @keyframes badgePop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.25) rotate(-25deg); }
    55%{ opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(6deg); }
    75%{ transform:translate(-50%,-50%) scale(.97) rotate(-2deg); }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  @keyframes sparkle{
    0%{ opacity:0; transform:scale(.4) rotate(0deg); }
    35%{ opacity:1; transform:scale(1.1) rotate(12deg); }
    100%{ opacity:0; transform:scale(.5) rotate(24deg); }
  }
  .pic.is-pop{ animation:cardBounce .55s cubic-bezier(.2,.9,.3,1.35); }
  @keyframes cardBounce{
    0%{ transform:scale(1); }
    28%{ transform:scale(.93); }
    62%{ transform:scale(1.06); }
    82%{ transform:scale(.985); }
    100%{ transform:scale(1); }
  }
  @media (hover:hover){
    .pic:hover{ box-shadow:0 12px 26px -14px rgba(24,42,86,.6), inset 0 0 0 2px #E1EBFA; }
  }
  .cards .s-empty{ align-self:center; justify-self:center; text-align:center; font-size:14px; font-weight:800; color:var(--ink-mute); grid-column:1/-1; grid-row:1/-1; }

  .star-pop{
    position:fixed; z-index:60; pointer-events:none;
    font-size:clamp(15px,2.1vh,25px);
    animation:starUp .9s ease-out forwards;
  }
  @keyframes starUp{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.5);}
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-160%) scale(1.15);}
  }

  /* ---------- confetti ---------- */
  #confetti{ position:fixed; inset:0; z-index:70; pointer-events:none; }

  /* ---------- settings ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:90;
    background:rgba(18,28,52,.42);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(10px,2vh,26px);
    opacity:0; transition:opacity .22s ease;
  }
  .backdrop.show{ opacity:1; }
  .panel{
    width:min(940px, 100%); max-height:min(94dvh, 940px);
    background:#fff; border-radius:clamp(20px,2.6vh,28px);
    box-shadow:0 40px 90px -30px rgba(10,20,45,.55);
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(10px) scale(.98); transition:transform .24s cubic-bezier(.2,.9,.3,1.2);
  }
  .backdrop.show .panel{ transform:none; }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:clamp(12px,1.8vh,18px) clamp(16px,2vw,24px);
    border-bottom:1px solid var(--line);
  }
  .panel-head h2{ margin:0; font-size:clamp(17px,2.2vh,22px); font-weight:900; letter-spacing:-.02em; }
  .panel-head .x{
    margin-left:auto; border:none; background:#F2F5FB; color:var(--ink-soft);
    width:36px; height:36px; border-radius:50%; font-size:17px; font-weight:900; cursor:pointer;
    display:grid; place-items:center; font-family:inherit;
  }
  .panel-body{ padding:clamp(10px,1.6vh,18px) clamp(16px,2vw,24px); overflow-y:auto; display:flex; flex-direction:column; gap:clamp(10px,1.5vh,16px); }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field > label{ font-size:clamp(13px,1.55vh,15px); font-weight:900; color:var(--ink-soft); }
  .field .sub{ font-size:clamp(11px,1.3vh,13px); font-weight:700; color:var(--ink-mute); }
  input[type="time"], .in{
    font-family:inherit; font-size:clamp(14px,1.7vh,17px); font-weight:800; color:var(--ink);
    background:#F5F8FD; border:1.5px solid var(--line); border-radius:14px;
    padding:10px 14px; outline:none; transition:border-color .18s ease, background .18s ease;
    min-width:0; width:100%;
  }
  input:focus{ border-color:#8FB8F8; background:#fff; }
  .time-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  input[type="time"]{ width:auto; min-width:150px; font-variant-numeric:tabular-nums; }

  @media (min-width:880px){
    #settingsKids{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.3vw,16px); align-items:start; }
  }
  .s-kid{
    border:1.5px solid var(--line); border-radius:20px; padding:clamp(10px,1.5vh,16px);
    display:flex; flex-direction:column; gap:10px; background:linear-gradient(180deg,#FBFDFF,#fff);
  }
  .s-head{ display:flex; align-items:center; gap:10px; }
  .s-avatar{
    width:52px; height:52px; flex:0 0 auto; text-align:center;
    font-size:24px; padding:0; border-radius:16px;
    background:linear-gradient(140deg,#EAF4FF,#F6FFFB); border:1.5px solid var(--line);
    font-family:inherit;
  }
  .s-name{ flex:1 1 auto; font-size:17px; font-weight:900; background:#F5F8FD; border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; font-family:inherit; color:var(--ink); min-width:0; }
  .s-order{ font-size:12px; font-weight:900; color:#fff; background:#C4D2E8; border-radius:999px; padding:4px 10px; }
  .s-items{ display:flex; flex-direction:column; gap:6px; }
  .s-item{ display:grid; grid-template-columns:58px minmax(0,1fr) 34px; gap:7px; align-items:center; }
  .s-icon{
    width:58px; height:44px; padding:2px; cursor:pointer; font-family:inherit;
    border:1.5px solid var(--line); border-radius:13px; background:#F5F8FD;
    display:grid; place-items:center; overflow:hidden;
    font-size:20px; line-height:1;
  }
  .s-icon img{ width:100%; height:100%; object-fit:contain; display:block; border-radius:9px; }
  .s-icon.emoji-mode{ font-size:22px; }
  .s-text{ height:44px; border:1.5px solid var(--line); border-radius:12px; background:#F5F8FD; padding:0 12px; font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); min-width:0; }
  .s-del{
    width:34px; height:34px; border-radius:50%; border:none; background:#FDEDEE; color:#E0483F;
    font-size:14px; font-weight:900; cursor:pointer; font-family:inherit;
  }
  .s-add{
    align-self:flex-start; border:1.5px dashed #C6D6EC; background:#fff; color:#3F86F7;
    font-family:inherit; font-size:13px; font-weight:900; border-radius:12px; padding:7px 14px; cursor:pointer;
  }
  .s-empty{ margin:2px 0; font-size:13px; font-weight:700; color:var(--ink-mute); }
  .panel-foot{
    display:flex; align-items:center; gap:10px;
    padding:clamp(12px,1.8vh,18px) clamp(16px,2vw,24px);
    border-top:1px solid var(--line); background:#FBFDFF;
  }
  .btn{
    font-family:inherit; font-size:clamp(14px,1.7vh,16px); font-weight:900; border-radius:14px;
    padding:12px 20px; cursor:pointer; border:1.5px solid transparent; transition:transform .12s ease, filter .18s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:linear-gradient(135deg,#3F86F7,#5A6BF0); color:#fff; box-shadow:0 10px 20px -10px rgba(63,134,247,.9); }
  .btn.ghost{ background:#fff; border-color:var(--line); color:var(--ink-soft); }
  .btn.mini{ padding:9px 14px; font-size:13px; border-radius:12px; }
  .spacer{ flex:1 1 auto; }

  /* ---------- picture picker ---------- */
  .ipop{
    position:fixed; z-index:120;
    left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(400px, 92vw); max-height:92vh; overflow:auto;
    background:#fff; border-radius:20px; padding:12px;
    box-shadow:0 30px 70px -20px rgba(10,20,45,.65);
    border:1.5px solid var(--line);
    display:flex; flex-direction:column; gap:10px;
    animation:popInC .18s ease;
  }
  @keyframes popInC{ from{ opacity:0; transform:translate(-50%,-50%) scale(.94);} to{ opacity:1; transform:translate(-50%,-50%) scale(1);} }
  .ipop-t{ font-size:13px; font-weight:900; color:var(--ink-mute); padding:0 2px; }
  .ipop-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .ipick{
    font-family:inherit; cursor:pointer; padding:4px 2px 3px;
    border:1.5px solid var(--line); border-radius:12px; background:#FBFDFF;
    display:flex; flex-direction:column; align-items:center; gap:1px;
  }
  .ipick.sel{ border-color:#5A9AF7; background:#EEF5FF; box-shadow:0 0 0 2px rgba(90,154,247,.18); }
  .ipick img{ width:100%; height:auto; object-fit:contain; display:block; }
  .ipick span{ font-size:11px; font-weight:900; color:var(--ink-soft); letter-spacing:-.03em; }
  .ipop-emoji{ display:flex; align-items:center; gap:7px; border-top:1px solid var(--line); padding-top:8px; }
  .ipop-emoji span{ font-size:12px; font-weight:900; color:var(--ink-mute); white-space:nowrap; }
  .ipop-in{
    flex:1 1 auto; min-width:0; height:36px; border:1.5px solid var(--line); border-radius:11px;
    background:#F5F8FD; padding:0 10px; font-family:inherit; font-size:16px; font-weight:800; color:var(--ink); text-align:center;
  }
  .ipop button.ipop-x{
    flex:0 0 auto; border:none; background:#F2F5FB; color:var(--ink-soft); font-family:inherit;
    font-size:12px; font-weight:900; border-radius:11px; padding:9px 12px; cursor:pointer;
  }

  /* ---------- preview popover ---------- */
  .pop{
    position:absolute; right:0; top:calc(100% + 10px); z-index:80;
    width:min(280px, 78vw);
    background:#fff; border-radius:18px; padding:8px;
    box-shadow:0 24px 50px -20px rgba(10,20,45,.5);
    border:1.5px solid var(--line);
    display:flex; flex-direction:column; gap:4px;
    animation:popIn .18s ease;
  }
  .pop .pop-t{ font-size:12px; font-weight:900; color:var(--ink-mute); padding:6px 10px 4px; }
  .pop button{
    font-family:inherit; text-align:left; font-size:14px; font-weight:800; color:var(--ink);
    background:transparent; border:none; border-radius:12px; padding:11px 12px; cursor:pointer;
  }
  .pop button:hover{ background:#F3F7FD; }
  .pop .pop-off{ color:#E0483F; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:clamp(16px,3vh,34px); transform:translate(-50%, 20px);
    z-index:130; background:#1B2542; color:#fff; font-size:14px; font-weight:800;
    padding:12px 20px; border-radius:999px; box-shadow:0 18px 40px -16px rgba(10,20,45,.8);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- responsive ---------- */
  @media (max-height:640px) and (orientation:landscape){
    .count{ font-size:clamp(30px, 10.5vh, 76px); }
  }
  @media (max-width:820px){
    body{ overflow:auto; }
    .app{ height:auto; min-height:100vh; min-height:100dvh; padding-bottom:24px; }
    .kids{ grid-template-columns:1fr; }
    .kid{ min-height:0; }
    .cards{ grid-template-rows:none; grid-auto-rows:minmax(116px, auto); }
    .pic-media img{ max-height:150px; }
    .pic-label{ font-size:15px; }
    .count{ font-size:clamp(34px, 12vw, 64px); }
    .t-hint{ display:none; }
    .toolbar{ flex-wrap:wrap; justify-content:flex-end; }
    .topbar{ flex-wrap:wrap; }
    .chip{ font-size:12px; padding:7px 11px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="date-block">
      <span class="date-txt" id="dateText">날짜</span>
      <span class="clock-txt" id="clockText">--:--:--</span>
    </div>
    <div class="toolbar">
      <button class="chip" id="soundBtn" type="button">🔔 소리 켜짐</button>
      <button class="chip" id="previewBtn" type="button">🧪 미리보기</button>
      <button class="chip" id="resetBtn" type="button">🔄 오늘 초기화</button>
      <button class="chip accent" id="settingsBtn" type="button">⚙️ 설정</button>

      <div class="pop" id="previewPop" hidden>
        <div class="pop-t">미리보기 — 남은 시간을 바꿔서 화면을 확인해요</div>
        <button type="button" data-min="45">🌤️ 45분 전 (여유)</button>
        <button type="button" data-min="12">⏰ 12분 전 (주의)</button>
        <button type="button" data-min="3">🏃 3분 전 (서둘러)</button>
        <button type="button" data-min="-3">🚀 출발 3분 지남</button>
        <button type="button" class="pop-off" data-min="off">미리보기 끄기</button>
      </div>
    </div>
  </header>

  <section class="timer" id="timerCard" data-phase="calm">
    <div class="t-top">
      <span class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">여유 있어요</span></span>
      <span class="preview-flag" id="previewFlag" hidden>미리보기</span>
      <span class="t-hint" id="hintText"></span>
      <span class="depart" id="departAt">출발 08:00</span>
    </div>
    <div class="t-count">
      <span class="count" id="countdown">00:00:00</span>
      <span class="count-label" id="countLabel">출발까지</span>
    </div>
    <div class="track">
      <div class="fill" id="timeFill"></div>
      <span class="rocket" id="rocket">🚀</span>
    </div>
  </section>

  <div class="all-done" id="allDone" hidden>
    <span class="ad-emoji">🎉</span>
    <span id="allDoneText">모두 준비 완료! 출발해요 🚀</span>
  </div>

  <main class="kids" id="kids"></main>
</div>

<canvas id="confetti"></canvas>

<div class="backdrop" id="settingsBackdrop" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head">
      <h2 id="settingsTitle">⚙️ 설정</h2>
      <button class="x" id="closeSettings" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="panel-body">
      <div class="field">
        <label for="departureInput">등원 출발 시간</label>
        <div class="time-row">
          <input type="time" id="departureInput" value="08:00">
          <span class="sub">이 시간을 기준으로 남은 시간이 줄어들어요. (기본 08:00)</span>
        </div>
      </div>
      <div class="field">
        <label>아이 이름 · 아바타 · 그림 카드</label>
        <span class="sub">그림칸을 누르면 6가지 그림 중에서 고를 수 있어요. 그림 대신 이모지도 쓸 수 있어요.</span>
      </div>
      <div id="settingsKids"></div>
    </div>
    <div class="panel-foot">
      <button class="btn ghost mini" id="restoreBtn" type="button">기본값 복원</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="cancelBtn" type="button">취소</button>
      <button class="btn primary" id="saveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<div class="ipop" id="iconPop" hidden></div>

<div class="toast" id="toast"></div>

  var PIC_META = [
    { key:"toilet", label:"화장실" },
    { key:"wash",   label:"씻기" },
    { key:"dress",  label:"옷입기" },
    { key:"eat",    label:"밥먹기" },
    { key:"bag",    label:"가방" },
    { key:"shoes",  label:"신발" }
  ];
  var PIC_LABEL = {};
  PIC_META.forEach(function (m) { PIC_LABEL[m.key] = m.label; });
  var EMOJI_ICON = { "🚽":"toilet", "🧻":"toilet", "🚻":"toilet", "🪥":"wash", "🧼":"wash", "🚿":"wash",
                     "👕":"dress", "👚":"dress", "🧥":"dress", "🍚":"eat", "🍙":"eat", "🥣":"eat",
                     "🎒":"bag", "💧":"bag", "👟":"shoes", "👞":"shoes", "🥾":"shoes" };

  var KEY = "dropoff-dashboard-v1";
  var seq = 0;
  var uid = function () {
    seq += 1;
    return "i" + Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 5);
  };

  function baseItems() {
    return [
      { icon:"toilet", emoji:"🚽", text:"화장실" },
      { icon:"wash",   emoji:"🪥", text:"씻기" },
      { icon:"dress",  emoji:"👕", text:"옷입기" },
      { icon:"eat",    emoji:"🍚", text:"밥먹기" },
      { icon:"bag",    emoji:"🎒", text:"가방챙기기" },
      { icon:"shoes",  emoji:"👟", text:"신발신기" }
    ];
  }

  function defaults() {
    return {
      departure: "08:00",
      soundOn: true,
      children: [
        { id:"c1", name:"유주", avatar:"🦊", theme:"sky",   items: baseItems() },
        { id:"c2", name:"유현", avatar:"🐯", theme:"coral", items: baseItems() }
      ]
    };
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function clip(s, n) { return String(s == null ? "" : s).trim().slice(0, n); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  var dayFmt = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function hms(ms) {
    ms = Math.max(0, Math.floor(ms / 1000));
    return pad2(Math.floor(ms / 3600)) + ":" + pad2(Math.floor((ms % 3600) / 60)) + ":" + pad2(ms % 60);
  }
  function hhmm(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }

  function normalize(raw) {
    var d = defaults();
    raw = raw && typeof raw === "object" ? raw : {};
    var out = {
      departure: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(raw.departure || "")) ? raw.departure : d.departure,
      soundOn: raw.soundOn !== false,
      children: []
    };
    var src = (Array.isArray(raw.children) && raw.children.length) ? raw.children.slice(0, 2) : d.children;
    var themes = ["sky", "coral"];
    function packItem(it) {
      it = it && typeof it === "object" ? it : {};
      var emoji = clip(it.emoji, 8);
      var icon = clip(it.icon, 12);
      if (!PIC[icon]) icon = EMOJI_ICON[clip(it.emoji, 8)] || "";
      return { id: it.id || uid(), icon: icon, emoji: emoji || "⭐", text: clip(it.text, 40) || "항목" };
    }
    for (var i = 0; i < src.length; i++) {
      var c = src[i] || {};
      var base = d.children[i] || d.children[0];
      var items = (Array.isArray(c.items) ? c.items : base.items).map(packItem);
      out.children.push({
        id: typeof c.id === "string" && c.id ? c.id : base.id,
        name: clip(c.name, 14) || base.name,
        avatar: clip(c.avatar, 8) || base.avatar,
        theme: themes.indexOf(c.theme) >= 0 ? c.theme : (i === 0 ? "sky" : "coral"),
        items: items
      });
    }
    while (out.children.length < 2) {
      var b = d.children[out.children.length];
      out.children.push({
        id: b.id, name: b.name, avatar: b.avatar, theme: b.theme,
        items: b.items.map(function (it) { return { id: uid(), icon: it.icon, emoji: it.emoji, text: it.text }; })
      });
    }
    return out;
  }

  var state = loadState();

  function loadState() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { raw = null; }
    var settings = normalize(raw && raw.settings);
    var day = todayKey();
    var sameDay = !!raw && raw.day === day;
    var checks = sameDay && raw.checks && typeof raw.checks === "object" ? raw.checks : {};
    settings.children.forEach(function (c) {
      if (!checks[c.id] || typeof checks[c.id] !== "object") checks[c.id] = {};
    });
    return { settings: settings, day: day, checks: checks };
  }

  function saveState() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        settings: state.settings, day: state.day, checks: state.checks
      }));
    } catch (e) { /* 저장 공간이 막혀 있어도 화면은 계속 동작 */ }
  }

  /* ---------------- elements ---------------- */
  var el = function (id) { return document.getElementById(id); };
  var dateText = el("dateText"), clockText = el("clockText");
  var soundBtn = el("soundBtn"), previewBtn = el("previewBtn"), resetBtn = el("resetBtn"), settingsBtn = el("settingsBtn");
  var timerCard = el("timerCard"), statusText = el("statusText"), departAt = el("departAt");
  var countdown = el("countdown"), countLabel = el("countLabel"), timeFill = el("timeFill"), rocket = el("rocket");
  var previewFlag = el("previewFlag"), hintText = el("hintText");
  var allDone = el("allDone"), allDoneText = el("allDoneText");
  var kidsEl = el("kids");
  var previewPop = el("previewPop");
  var backdrop = el("settingsBackdrop"), settingsKids = el("settingsKids"), departureInput = el("departureInput");
  var iconPop = el("iconPop");
  var toastEl = el("toast");

  /* ---------------- sound ---------------- */
  var actx = null;
  function audio() {
    if (!state.settings.soundOn) return null;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!actx) actx = new AC();
      if (actx.state === "suspended" && actx.resume) actx.resume();
      return actx;

    var c = colors || ["#34A9F5", "#2FD3A8", "#FFC93C", "#FF8A5B", "#B08BFF"];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 3 + Math.random() * 9;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 6,
        r: 3 + Math.random() * 6,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        color: c[Math.floor(Math.random() * c.length)],
        life: 1,
        decay: 0.008 + Math.random() * 0.008,

    ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);

      var rows = secs[s].querySelectorAll(".s-item");
      for (var r = 0; r < rows.length && r < c.items.length; r++) {
        c.items[r].text = rows[r].querySelector(".s-text").value;
      }
    }
  }

  iconPop.querySelector(".ipop-in").addEventListener("input", function () {
    if (!pickTarget) return;
    var it = draft.children[pickTarget.ci].items[pickTarget.ii];
    it.icon = "";
    it.emoji = this.value.trim() || "⭐";
    var btn = settingsKids.querySelector('.s-icon[data-ci="' + pickTarget.ci + '"][data-ii="' + pickTarget.ii + '"]');
    if (btn) {
      btn.className = "s-icon emoji-mode";
      btn.textContent = it.emoji;
    }
    iconPop.querySelectorAll(".ipick").forEach(function (b) { b.classList.remove("sel"); });
  });

  document.addEventListener("click", function (e) {
    if (!iconPop.hidden && !iconPop.contains(e.target) && !e.target.closest(".s-icon")) hideIconPop();
  });

  settingsKids.addEventListener("input", function () { syncDraftFromDom(); });
  settingsKids.addEventListener("click", function (e) {
    var icon = e.target.closest(".s-icon");
    if (icon) {
      syncDraftFromDom();
      showIconPop(icon);
      return;
    }
    var del = e.target.closest(".s-del");
    if (del) {
      syncDraftFromDom();
      var ci = parseInt(del.getAttribute("data-ci"), 10);
      var ii = parseInt(del.getAttribute("data-ii"), 10);
      draft.children[ci].items.splice(ii, 1);
      hideIconPop();
      paintDraft();
      return;
    }
    var add = e.target.closest(".s-add");
    if (add) {
      syncDraftFromDom();
      var k = parseInt(add.getAttribute("data-ci"), 10);
      draft.children[k].items.push({ id: uid(), icon: "", emoji: "⭐", text: "" });
      paintDraft();
      var sec = settingsKids.querySelector('.s-kid[data-ci="' + k + '"]');
      var last = sec.querySelectorAll(".s-text");
      if (last.length) { last[last.length - 1].focus(); }
    }
  });

  settingsBtn.addEventListener("click", openSettings);
  el("closeSettings").addEventListener("click", closeSettings);
  el("cancelBtn").addEventListener("click", closeSettings);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeSettings(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!iconPop.hidden) { hideIconPop(); return; }
    if (!backdrop.hidden) closeSettings();
  });
  window.addEventListener("resize", function () { if (!iconPop.hidden) hideIconPop(); });
  backdrop.addEventListener("scroll", function () { if (!iconPop.hidden) hideIconPop(); }, true);

  el("restoreBtn").addEventListener("click", function () {
    if (!window.confirm("이름·아바타·그림 카드·출발 시간을 기본값으로 되돌릴까요? (저장을 눌러야 적용돼요)")) return;
    draft = normalize(defaults());
    departureInput.value = draft.departure;
    hideIconPop();
    paintDraft();
    showToast("기본값을 불러왔어요. 저장을 눌러 주세요");
  });

  el("saveBtn").addEventListener("click", function () {
    syncDraftFromDom();

    var candidate = { departure: departureInput.value || "08:00", soundOn: state.settings.soundOn, children: [] };
    for (var i = 0; i < draft.children.length; i++) {
      var c = draft.children[i];
      var items = c.items.filter(function (it) { return String(it.text || "").trim() !== ""; });
      candidate.children.push({
        id: c.id,
        name: String(c.name || "").trim() || (defaults().children[i] ? defaults().children[i].name : "아이"),
        avatar: String(c.avatar || "").trim() || "⭐",
        theme: c.theme,
        items: items
      });
    }
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(candidate.departure)) candidate.departure = "08:00";

    state.settings = normalize(candidate);
    state.settings.children.forEach(function (c) {
      if (!state.checks[c.id]) state.checks[c.id] = {};
    });
    saveState();
    closeSettings();
    renderKids();
    refreshBanner(true);
    tick();
    showToast("저장했어요! 다음에 열어도 그대로예요");
  });

  /* ---------------- boot ---------------- */
  paintSoundBtn();
  renderKids();
  refreshBanner(true);
  tick();
  saveState();
})();
</script>
</body>
</html>
