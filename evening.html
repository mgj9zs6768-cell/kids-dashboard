<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="저녁 할일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F8FE">
<title>유주 저녁 공부 대시보드</title>
<style>
  :root{
    --ink:#16203C;
    --ink-soft:#5F6B8A;
    --ink-mute:#93A0BB;
    --line:#E6EDF9;
    --card:#FFFFFF;
    --g:clamp(7px, 1.1vh, 14px);
    --r-lg:clamp(18px, 2.2vh, 28px);
    --shadow:0 18px 40px -18px rgba(24,42,86,.30), 0 4px 14px -6px rgba(24,42,86,.10);
    --shadow-sm:0 8px 20px -12px rgba(24,42,86,.28);
    --calm:#0FB57F;
    --calm-soft:rgba(15,181,127,.13);
    --warn:#F08C00;
    --warn-soft:rgba(240,140,0,.14);
    --hurry:#EF3B4E;
    --hurry-soft:rgba(239,59,78,.14);
    --late:#E0483F;
    --late-soft:rgba(224,72,63,.13);
    --done:#0FAE74;
    --done-soft:rgba(15,174,116,.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }

  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Helvetica Neue", Arial, "Liberation Sans", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 640px at 4% -14%, #E7E9FF 0%, rgba(231,233,255,0) 62%),
      radial-gradient(900px 560px at 104% -8%, #FFE9E0 0%, rgba(255,233,224,0) 58%),
      radial-gradient(1000px 720px at 50% 120%, #E2FBF1 0%, rgba(226,251,241,0) 62%),
      #F7F8FE;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  body::before, body::after{
    content:"";
    position:fixed; z-index:0; border-radius:50%; filter:blur(46px); opacity:.55; pointer-events:none;
  }
  body::before{ width:34vw; height:34vw; left:-10vw; top:40vh; background:radial-gradient(circle,#C9CBFF,transparent 70%); }
  body::after{ width:30vw; height:30vw; right:-8vw; bottom:-6vw; background:radial-gradient(circle,#FFDCC2,transparent 70%); }

  .app{
    position:relative; z-index:1;
    height:100vh;
    height:100dvh;
    display:flex; flex-direction:column;
    padding:clamp(6px, 1.1vh, 14px) clamp(12px, 2vw, 30px) clamp(8px, 1.3vh, 16px);
    max-width:1560px; margin:0 auto;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; row-gap:6px;
    margin-bottom:var(--g);
    min-height:clamp(34px, 5vh, 46px);
  }
  .date-block{ display:flex; align-items:baseline; gap:clamp(8px,1.2vw,16px); min-width:0; }
  .date-txt{
    font-size:clamp(14px, 1.8vh, 21px); font-weight:800; color:var(--ink-soft);
    letter-spacing:-.01em; white-space:nowrap;
  }
  .clock-txt{
    font-size:clamp(20px, 3vh, 32px); font-weight:800; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; white-space:nowrap;
  }
  .who{
    display:flex; align-items:center; gap:clamp(5px,.7vw,8px); min-width:0; flex:0 0 auto;
    background:rgba(255,255,255,.86); border:1.5px solid rgba(255,255,255,.95);
    box-shadow:var(--shadow-sm); border-radius:999px;
    padding:clamp(2px,.4vh,4px) clamp(9px,1vw,13px) clamp(2px,.4vh,4px) clamp(3px,.4vw,5px);
  }
  .who-avatar{
    width:clamp(24px,3.6vh,38px); height:clamp(24px,3.6vh,38px);
    display:grid; place-items:center;
    font-size:clamp(15px,2.3vh,23px); line-height:1;
    border-radius:32%;
    background:linear-gradient(140deg,#FFF1E4,#F1F5FF);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95);
  }
  .who-name{
    font-size:clamp(15px,2.1vh,23px); font-weight:900; letter-spacing:-.03em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:32vw;
  }
  .who-sub{
    font-size:clamp(10px,1.3vh,13px); font-weight:900; color:#8A6BD8;
    background:rgba(155,123,246,.13); border-radius:999px;
    padding:2px 8px; white-space:nowrap;
  }
  .toolbar{ display:flex; align-items:center; gap:clamp(5px,.6vw,9px); position:relative; }
  .chip{
    font-family:inherit; font-size:clamp(11px, 1.4vh, 15px); font-weight:800; color:var(--ink-soft);
    background:rgba(255,255,255,.82); border:1.5px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow-sm);
    border-radius:999px; padding:clamp(6px,.8vh,10px) clamp(9px,1vw,15px);
    cursor:pointer; white-space:nowrap;
    transition:transform .12s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .chip:active{ transform:scale(.95); }
  .chip.accent{ color:#fff; background:linear-gradient(135deg,#7B6BF5,#9B5CF6); border-color:transparent; }
  .chip.active{ color:#fff; background:linear-gradient(135deg,#8A5CF6,#B15CF6); border-color:transparent; }
  @media (hover:hover){ .chip:hover{ background:#fff; color:var(--ink); } .chip.accent:hover,.chip.active:hover{ color:#fff; } }

  /* ---------- timer hero ---------- */
  .timer{
    --state:var(--calm); --state-soft:var(--calm-soft);
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,#FFFFFF 0%,#FFFFFF 48%,var(--state-soft) 100%);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow);
    border:1.5px solid rgba(255,255,255,.95);
    padding:clamp(8px, 1.2vh, 14px) clamp(14px, 2vw, 26px) clamp(10px, 1.4vh, 16px);
    display:flex; flex-direction:column; gap:clamp(3px,.7vh,9px);
    margin-bottom:var(--g);
    flex:0 0 auto;
    transition:background .6s ease, box-shadow .6s ease;
  }
  .timer[data-phase="warn"]{ --state:var(--warn); --state-soft:var(--warn-soft); }
  .timer[data-phase="hurry"]{ --state:var(--hurry); --state-soft:var(--hurry-soft); }
  .timer[data-phase="late"]{ --state:var(--late); --state-soft:var(--late-soft); }
  .timer[data-phase="over"]{ --state:var(--late); --state-soft:var(--late-soft); }
  .timer[data-phase="done"]{ --state:var(--done); --state-soft:var(--done-soft); }
  .timer[data-phase="hurry"]{ animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ box-shadow:var(--shadow); }
    50%{ box-shadow:0 18px 44px -16px rgba(239,59,78,.45), 0 0 0 4px rgba(239,59,78,.10); }
  }
  .t-top{ display:flex; align-items:center; gap:8px; min-height:0; }
  .badge{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    background:var(--state-soft); color:var(--state);
    font-size:clamp(12px, 1.6vh, 18px); font-weight:900;
    padding:clamp(4px,.6vh,7px) clamp(10px,1vw,15px);
    border-radius:999px; transition:background .5s ease,color .5s ease;
    letter-spacing:-.01em; white-space:nowrap;
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.35; transform:scale(.8);} }
  .t-hint{
    flex:1 1 auto; min-width:0;
    font-size:clamp(11px,1.5vh,16px); font-weight:700; color:var(--ink-soft);
    text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .t-hint b{ color:var(--ink); font-weight:800; }
  .preview-flag{
    flex:0 0 auto; font-size:clamp(10px,1.3vh,13px); font-weight:900; color:#fff;
    background:linear-gradient(135deg,#8A5CF6,#C15CF6); border-radius:999px; padding:3px 9px;
  }
  .goal{
    flex:0 0 auto; font-size:clamp(11px,1.5vh,16px); font-weight:900; color:var(--ink-soft);
    background:rgba(255,255,255,.8); border:1.5px solid var(--line);
    border-radius:999px; padding:clamp(3px,.5vh,6px) clamp(9px,.9vw,14px);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .t-main{ display:flex; align-items:flex-end; justify-content:space-between; gap:clamp(10px,2vw,28px); flex-wrap:wrap; }
  .t-count{ display:flex; align-items:baseline; gap:clamp(8px,1vw,16px); min-width:0; }
  .count{
    font-size:clamp(32px, min(8.4vw, 10.4vh), 96px);
    line-height:.94; font-weight:900; letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    color:var(--state);
    transition:color .5s ease;
    text-shadow:0 10px 26px var(--state-soft);
    white-space:nowrap;
  }
  .count.is-word{ font-size:clamp(28px, min(7.4vw, 9.2vh), 84px); letter-spacing:-.05em; }
  .count-side{ display:flex; flex-direction:column; gap:2px; padding-bottom:clamp(2px,.5vh,6px); }
  .count-label{ font-size:clamp(12px,1.7vh,19px); font-weight:900; color:var(--ink); }
  .count-sub{ font-size:clamp(11px,1.4vh,15px); font-weight:800; color:var(--ink-mute); white-space:nowrap; }
  .prog{ display:flex; flex-direction:column; align-items:flex-end; gap:clamp(4px,.7vh,8px); padding-bottom:clamp(2px,.6vh,8px); }
  .prog-top{ display:flex; align-items:baseline; gap:5px; font-weight:900; color:var(--ink-mute); white-space:nowrap; }
  .prog-top b{ font-size:clamp(24px,4vh,46px); color:var(--done); font-variant-numeric:tabular-nums; line-height:1; }
  .prog-top .slash{ font-size:clamp(14px,2vh,22px); color:#C2CCDD; }
  .prog-top .tot{ font-size:clamp(16px,2.2vh,26px); color:var(--ink-soft); }
  .prog-top .prog-label{ font-size:clamp(11px,1.4vh,15px); margin-left:4px; }
  .dots{ display:flex; gap:clamp(5px,.8vw,9px); }
  .dot-chip{
    width:clamp(30px,4.4vh,48px); height:clamp(30px,4.4vh,48px);
    border-radius:clamp(8px,1.2vh,13px);
    background:#F1F5FC; box-shadow:inset 0 0 0 1.5px #E6EDF9;
    overflow:hidden; display:grid; place-items:center; position:relative;
    font-size:clamp(13px,2vh,22px); line-height:1;
    transition:box-shadow .3s ease, transform .3s ease;
  }
  .dot-chip img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.42; filter:saturate(.45); transition:opacity .3s ease, filter .3s ease; }
  .dot-chip.on{ box-shadow:inset 0 0 0 2.5px #2FD98B, 0 6px 14px -8px rgba(15,174,116,.8); }
  .dot-chip.on img{ opacity:1; filter:none; }
  .dot-chip .em{ opacity:.45; transition:opacity .3s ease; }
  .dot-chip.on .em{ opacity:1; }
  .dot-chip::after{
    content:"✓"; position:absolute; right:0; bottom:0;
    font-size:clamp(8px,1.2vh,12px); font-weight:900; color:#0FAE74;
    background:#fff; border-radius:50%; width:clamp(12px,1.7vh,16px); height:clamp(12px,1.7vh,16px);
    box-shadow:0 0 0 1.5px #fff;
    display:none; place-items:center; box-shadow:0 2px 6px -2px rgba(24,42,86,.4);
  }
  .dot-chip.on::after{ display:grid; }

  .track{
    position:relative; height:clamp(10px, 1.6vh, 18px);
    background:#EDF2FA; border-radius:999px; box-shadow:inset 0 1px 3px rgba(24,42,86,.08);
    margin-top:clamp(1px,.4vh,5px);
  }
  .fill{
    position:relative; height:100%; width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#2FD98B,#0FB57F 60%,#22C1C3);
    transition:width .5s cubic-bezier(.3,.9,.3,1);
    overflow:hidden;
  }
  .fill::after{
    content:""; position:absolute; inset:0;
    background-image:linear-gradient(90deg, rgba(255,255,255,0) 0 52%, rgba(255,255,255,.34) 52% 100%);
    background-size:30px 100%;
    animation:slide 1.6s linear infinite;
    opacity:.8;
  }
  @keyframes slide{ from{ background-position:0 0; } to{ background-position:30px 0; } }
  .knob{
    position:absolute; top:50%; left:0%;
    width:clamp(15px,2.1vh,23px); height:clamp(15px,2.1vh,23px);
    transform:translate(0,-50%);
    border-radius:50%; background:#fff;
    box-shadow:0 0 0 clamp(2px,.42vh,4px) #2FD98B, 0 4px 10px -5px rgba(24,42,86,.45);
    transition:left .5s cubic-bezier(.3,.9,.3,1), opacity .3s ease, box-shadow .4s ease;
    pointer-events:none;
  }
  .knob.at-end{ box-shadow:0 0 0 clamp(2px,.42vh,4px) #0FAE74, 0 4px 10px -5px rgba(24,42,86,.45); }

  /* ---------- all done banner ---------- */
  .all-done{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:var(--g);
    padding:clamp(6px,1vh,12px) clamp(12px,2vw,22px);
    border-radius:var(--r-lg);
    background:linear-gradient(100deg,#7BF1C0,#8FD8FF 45%,#FFD9A5);
    box-shadow:0 16px 34px -18px rgba(30,180,150,.7), 0 0 0 1.5px rgba(255,255,255,.7) inset;
    font-size:clamp(14px,1.95vh,23px); font-weight:900; letter-spacing:-.02em; color:#0E3532;
    animation:bannerIn .55s cubic-bezier(.2,.9,.3,1.35);
    text-align:center;
  }
  .all-done .ad-emoji{ font-size:clamp(18px,2.5vh,29px); animation:bob 1.4s ease-in-out infinite; }
  @keyframes bannerIn{ from{ opacity:0; transform:translateY(-14px) scale(.96);} to{ opacity:1; transform:none;} }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-5px) rotate(4deg);} }

  /* ---------- picture cards ---------- */
  .cards{
    flex:1 1 auto; min-height:0; min-width:0;
    display:grid;
    gap:clamp(6px,1vh,12px);
    overflow:hidden;
    align-content:stretch;
  }
  .cards.narrow{ overflow:visible; }
  .pic{
    position:relative; min-width:0; min-height:0; overflow:hidden;
    font-family:inherit; border:none; padding:0; margin:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 66%,var(--soft) 100%);
    border-radius:clamp(15px,2.1vh,24px);
    box-shadow:0 8px 20px -16px rgba(24,42,86,.7), inset 0 0 0 1.5px #EEF3FB;
    transition:background .25s ease, box-shadow .25s ease, transform .12s ease;
    -webkit-appearance:none; appearance:none;
  }
  .pic[data-tint="blue"]{ --c1:#3D9BF5; --c2:#5FD0E8; --soft:rgba(61,155,245,.11); --deep:#1268B8; }
  .pic[data-tint="orange"]{ --c1:#FF9654; --c2:#FFC93C; --soft:rgba(255,150,84,.12); --deep:#C85C1F; }
  .pic[data-tint="green"]{ --c1:#41C98A; --c2:#9BE38C; --soft:rgba(65,201,138,.12); --deep:#1F8459; }
  .pic[data-tint="purple"]{ --c1:#9B7BF6; --c2:#C99BF6; --soft:rgba(155,123,246,.12); --deep:#6743C0; }
  .pic[data-tint="pink"]{ --c1:#FF7FA8; --c2:#FFB3C6; --soft:rgba(255,127,168,.12); --deep:#C74B70; }
  .pic[data-tint="teal"]{ --c1:#2BBFC4; --c2:#7FE0C6; --soft:rgba(43,191,196,.12); --deep:#137F83; }
  .pic[data-tint="yellow"]{ --c1:#F5B91E; --c2:#FFDD77; --soft:rgba(245,185,30,.13); --deep:#A57A05; }
  .pic[data-tint="red"]{ --c1:#F2545B; --c2:#FF9A8B; --soft:rgba(242,84,91,.12); --deep:#B62B33; }
  .pic:active{ transform:scale(.968); }
  .pic-media{
    position:relative; flex:1 1 auto; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(4px,.9vh,10px) clamp(4px,.8vw,12px) 0;
    transition:opacity .3s ease, filter .3s ease, transform .3s ease;
  }
  .pic-media img{
    width:100%; height:100%; object-fit:contain; object-position:center; display:block;
    border-radius:clamp(9px,1.3vh,14px);
  }
  .pic-media .em{ font-size:clamp(30px,6vh,64px); line-height:1; }
  .pic-label{
    flex:0 0 auto; max-width:100%;
    padding:0 clamp(4px,.5vw,9px) clamp(6px,1vh,11px);
    font-size:clamp(15px,2.4vh,27px); font-weight:900; letter-spacing:-.035em;
    color:var(--deep,var(--ink)); line-height:1.16;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .25s ease;
  }
  .pic-tint{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(160deg, var(--soft), rgba(255,255,255,.25));
    opacity:0; transition:opacity .35s ease;
  }
  .pic.on .pic-tint{ opacity:1; }
  .pic.on{ box-shadow:inset 0 0 0 2.5px var(--c1), 0 12px 26px -18px rgba(24,42,86,.8); }
  .pic.on .pic-media{ opacity:.62; filter:saturate(.7); transform:scale(.93); }
  .pic.on .pic-label{ color:#8b97b0; }
  .pic-badge{
    position:absolute; left:50%; top:calc(50% - clamp(7px,1.1vh,12px));
    transform:translate(-50%,-50%) scale(.2) rotate(-30deg);
    width:clamp(40px,6.2vh,62px); height:clamp(40px,6.2vh,62px); border-radius:50%;
    display:grid; place-items:center;
    background:linear-gradient(150deg,#2FD98B,#0FAE74);
    color:#fff; font-size:clamp(22px,3.7vh,36px); font-weight:900; line-height:1;
    box-shadow:0 10px 24px -8px rgba(15,174,116,.85), 0 0 0 clamp(3px,.5vh,5px) rgba(255,255,255,.95);
    opacity:0; pointer-events:none;
  }
  .pic.on .pic-badge{ animation:badgePop .6s cubic-bezier(.2,.9,.3,1.5) forwards; }
  .pic-badge::before, .pic-badge::after{
    content:"✨"; position:absolute; font-size:clamp(13px,2vh,22px); opacity:0;
  }
  .pic-badge::before{ right:-52%; top:-38%; }
  .pic-badge::after{ content:"✦"; left:-52%; bottom:-30%; color:#FFD84D; }
  .pic.on .pic-badge::before{ animation:sparkle 1.1s ease-out .22s infinite; }
  .pic.on .pic-badge::after{ animation:sparkle 1.3s ease-out .38s infinite; }
  @keyframes badgePop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.25) rotate(-25deg); }
    55%{ opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(6deg); }
    75%{ transform:translate(-50%,-50%) scale(.97) rotate(-2deg); }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  @keyframes sparkle{
    0%{ opacity:0; transform:scale(.4) rotate(0deg); }
    35%{ opacity:1; transform:scale(1.1) rotate(12deg); }
    100%{ opacity:0; transform:scale(.5) rotate(24deg); }
  }
  .pic.is-pop{ animation:cardBounce .55s cubic-bezier(.2,.9,.3,1.35); }
  @keyframes cardBounce{
    0%{ transform:scale(1); }
    28%{ transform:scale(.93); }
    62%{ transform:scale(1.06); }
    82%{ transform:scale(.985); }
    100%{ transform:scale(1); }
  }
  @media (hover:hover){
    .pic:hover{ box-shadow:0 12px 26px -14px rgba(24,42,86,.6), inset 0 0 0 2px #E1EBFA; }
  }
  .cards .s-empty{ align-self:center; justify-self:center; text-align:center; font-size:15px; font-weight:800; color:var(--ink-mute); grid-column:1/-1; grid-row:1/-1; }
  .cards.narrow .pic-media img{ height:auto; max-height:clamp(140px, 34vh, 260px); }
  .cards.narrow .pic-label{ font-size:clamp(16px, 4.6vw, 22px); }

  .star-pop{
    position:fixed; z-index:60; pointer-events:none;
    font-size:clamp(15px,2.1vh,25px);
    animation:starUp .9s ease-out forwards;
  }
  @keyframes starUp{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.5);}
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-160%) scale(1.15);}
  }

  /* ---------- confetti ---------- */
  #confetti{ position:fixed; inset:0; z-index:70; pointer-events:none; }

  /* ---------- settings ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:90;
    background:rgba(18,28,52,.42);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(10px,2vh,26px);
    opacity:0; transition:opacity .22s ease;
  }
  .backdrop.show{ opacity:1; }
  .panel{
    width:min(720px, 100%); max-height:min(94dvh, 900px);
    background:#fff; border-radius:clamp(20px,2.6vh,28px);
    box-shadow:0 40px 90px -30px rgba(10,20,45,.55);
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(10px) scale(.98); transition:transform .24s cubic-bezier(.2,.9,.3,1.2);
  }
  .backdrop.show .panel{ transform:none; }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:clamp(12px,1.8vh,18px) clamp(16px,2vw,24px);
    border-bottom:1px solid var(--line);
  }
  .panel-head h2{ margin:0; font-size:clamp(17px,2.2vh,22px); font-weight:900; letter-spacing:-.02em; }
  .panel-head .x{
    margin-left:auto; border:none; background:#F2F5FB; color:var(--ink-soft);
    width:36px; height:36px; border-radius:50%; font-size:17px; font-weight:900; cursor:pointer;
    display:grid; place-items:center; font-family:inherit;
  }
  .panel-body{ padding:clamp(10px,1.6vh,18px) clamp(16px,2vw,24px); overflow-y:auto; display:flex; flex-direction:column; gap:clamp(12px,1.8vh,18px); }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field > label{ font-size:clamp(13px,1.55vh,15px); font-weight:900; color:var(--ink-soft); }
  .field .sub{ font-size:clamp(11px,1.3vh,13px); font-weight:700; color:var(--ink-mute); line-height:1.45; }
  input[type="time"], .in{
    font-family:inherit; font-size:clamp(14px,1.7vh,17px); font-weight:800; color:var(--ink);
    background:#F5F8FD; border:1.5px solid var(--line); border-radius:14px;
    padding:10px 14px; outline:none; transition:border-color .18s ease, background .18s ease;
    min-width:0; width:100%;
  }
  input:focus{ border-color:#9FB8F8; background:#fff; }
  .time-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  input[type="time"]{ width:auto; min-width:150px; font-variant-numeric:tabular-nums; }
  .who-row{ display:flex; align-items:center; gap:10px; }
  .s-avatar{
    width:56px; height:56px; flex:0 0 auto; text-align:center;
    font-size:26px; padding:0; border-radius:16px;
    background:linear-gradient(140deg,#FFF1E4,#F2F6FF); border:1.5px solid var(--line);
    font-family:inherit; color:var(--ink);
  }
  .s-name{ flex:1 1 auto; font-size:17px; font-weight:900; background:#F5F8FD; border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; font-family:inherit; color:var(--ink); min-width:0; }
  .s-items{ display:flex; flex-direction:column; gap:7px; }
  .s-item{ display:grid; grid-template-columns:64px minmax(0,1fr) 36px; gap:8px; align-items:center; }
  .s-icon{
    width:64px; height:48px; padding:2px; cursor:pointer; font-family:inherit;
    border:1.5px solid var(--line); border-radius:13px; background:#F5F8FD;
    display:grid; place-items:center; overflow:hidden;
    font-size:22px; line-height:1;
  }
  .s-icon img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:10px; }
  .s-icon.emoji-mode{ font-size:24px; }
  .s-text{ height:48px; border:1.5px solid var(--line); border-radius:12px; background:#F5F8FD; padding:0 12px; font-family:inherit; font-size:16px; font-weight:700; color:var(--ink); min-width:0; }
  .s-del{
    width:36px; height:36px; border-radius:50%; border:none; background:#FDEDEE; color:#E0483F;
    font-size:14px; font-weight:900; cursor:pointer; font-family:inherit;
  }
  .s-add{
    align-self:flex-start; border:1.5px dashed #C6D6EC; background:#fff; color:#3F86F7;
    font-family:inherit; font-size:13px; font-weight:900; border-radius:12px; padding:8px 15px; cursor:pointer;
  }
  .s-empty{ margin:2px 0; font-size:13px; font-weight:700; color:var(--ink-mute); }
  .panel-foot{
    display:flex; align-items:center; gap:10px;
    padding:clamp(12px,1.8vh,18px) clamp(16px,2vw,24px);
    border-top:1px solid var(--line); background:#FBFDFF;
  }
  .btn{
    font-family:inherit; font-size:clamp(14px,1.7vh,16px); font-weight:900; border-radius:14px;
    padding:12px 20px; cursor:pointer; border:1.5px solid transparent; transition:transform .12s ease, filter .18s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:linear-gradient(135deg,#7B6BF5,#9B5CF6); color:#fff; box-shadow:0 10px 20px -10px rgba(123,107,245,.9); }
  .btn.ghost{ background:#fff; border-color:var(--line); color:var(--ink-soft); }
  .btn.mini{ padding:9px 14px; font-size:13px; border-radius:12px; }
  .spacer{ flex:1 1 auto; }

  /* ---------- picture picker ---------- */
  .ipop{
    position:fixed; z-index:120;
    left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(420px, 92vw); max-height:92vh; overflow:auto;
    background:#fff; border-radius:20px; padding:12px;
    box-shadow:0 30px 70px -20px rgba(10,20,45,.65);
    border:1.5px solid var(--line);
    display:flex; flex-direction:column; gap:10px;
    animation:popInC .18s ease;
  }
  @keyframes popInC{ from{ opacity:0; transform:translate(-50%,-50%) scale(.94);} to{ opacity:1; transform:translate(-50%,-50%) scale(1);} }
  .ipop-t{ font-size:13px; font-weight:900; color:var(--ink-mute); padding:0 2px; }
  .ipop-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; }
  .ipick{
    font-family:inherit; cursor:pointer; padding:4px 2px 3px;
    border:1.5px solid var(--line); border-radius:12px; background:#FBFDFF;
    display:flex; flex-direction:column; align-items:center; gap:1px;
  }
  .ipick.sel{ border-color:#8A7CF8; background:#F1EFFF; box-shadow:0 0 0 2px rgba(138,124,248,.2); }
  .ipick img{ width:100%; height:auto; object-fit:contain; display:block; border-radius:8px; }
  .ipick span{ font-size:11px; font-weight:900; color:var(--ink-soft); letter-spacing:-.03em; }
  .ipop-emoji{ display:flex; align-items:center; gap:7px; border-top:1px solid var(--line); padding-top:8px; }
  .ipop-emoji span{ font-size:12px; font-weight:900; color:var(--ink-mute); white-space:nowrap; }
  .ipop-in{
    flex:1 1 auto; min-width:0; height:36px; border:1.5px solid var(--line); border-radius:11px;
    background:#F5F8FD; padding:0 10px; font-family:inherit; font-size:16px; font-weight:800; color:var(--ink); text-align:center;
  }
  .ipop button.ipop-x{
    flex:0 0 auto; border:none; background:#F2F5FB; color:var(--ink-soft); font-family:inherit;
    font-size:12px; font-weight:900; border-radius:11px; padding:9px 12px; cursor:pointer;
  }

  /* ---------- preview popover ---------- */
  .pop{
    position:absolute; right:0; top:calc(100% + 10px); z-index:80;
    width:min(300px, 80vw);
    background:#fff; border-radius:18px; padding:8px;
    box-shadow:0 24px 50px -20px rgba(10,20,45,.5);
    border:1.5px solid var(--line);
    display:flex; flex-direction:column; gap:3px;
    animation:popIn .18s ease;
  }
  @keyframes popIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:none;} }
  .pop .pop-t{ font-size:12px; font-weight:900; color:var(--ink-mute); padding:6px 10px 4px; line-height:1.4; }
  .pop button{
    font-family:inherit; text-align:left; font-size:14px; font-weight:800; color:var(--ink);
    background:transparent; border:none; border-radius:12px; padding:11px 12px; cursor:pointer;
  }
  .pop button:hover{ background:#F3F7FD; }
  .pop .pop-off{ color:#E0483F; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:clamp(16px,3vh,34px); transform:translate(-50%, 20px);
    z-index:130; background:#1B2542; color:#fff; font-size:14px; font-weight:800;
    padding:12px 20px; border-radius:999px; box-shadow:0 18px 40px -16px rgba(10,20,45,.8);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- responsive ---------- */
  @media (max-height:620px) and (orientation:landscape){
    .count{ font-size:clamp(28px, 9.5vh, 74px); }
    .prog-top b{ font-size:clamp(20px,3.2vh,34px); }
  }
  @media (max-width:760px){
    body{ overflow:auto; }
    .app{ height:auto; min-height:100vh; min-height:100dvh; padding-bottom:24px; }
    .topbar{ flex-wrap:wrap; }
    .toolbar{ flex-wrap:wrap; justify-content:flex-end; }
    .count{ font-size:clamp(32px, 11vw, 60px); }
    .t-hint{ display:none; }
    .who-name{ max-width:40vw; }
    .prog{ align-items:flex-start; }
    .t-main{ align-items:flex-start; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="date-block">
      <span class="date-txt" id="dateText">날짜</span>
      <span class="clock-txt" id="clockText">--:--:--</span>
    </div>
    <div class="toolbar">
      <button class="chip" id="soundBtn" type="button">🔔 소리 켜짐</button>
      <button class="chip" id="previewBtn" type="button">🧪 미리보기</button>
      <button class="chip" id="resetBtn" type="button">🔄 오늘 초기화</button>
      <button class="chip accent" id="settingsBtn" type="button">⚙️ 설정</button>

      <div class="pop" id="previewPop" hidden>
        <div class="pop-t">미리보기 — 남은 시간과 화면을 확인해요</div>
        <button type="button" data-min="90">🌙 90분 전 (여유)</button>
        <button type="button" data-min="30">⏰ 30분 전 (슬슬)</button>
        <button type="button" data-min="8">🏃 8분 전 (서둘러)</button>
        <button type="button" data-min="-12">⌛ 목표 시간 지남</button>
        <button type="button" data-celebrate="1">🎉 완료 축하 미리보기</button>
        <button type="button" class="pop-off" data-min="off">미리보기 끄기</button>
      </div>
    </div>
  </header>

  <section class="timer" id="timerCard" data-phase="calm">
    <div class="t-top">
      <span class="who">
        <span class="who-avatar" id="whoAvatar">🦊</span>
        <span class="who-name" id="whoName">유주</span>
        <span class="who-sub">저녁 공부</span>
      </span>
      <span class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">여유 있어요</span></span>
      <span class="preview-flag" id="previewFlag" hidden>미리보기</span>
      <span class="t-hint" id="hintText"></span>
      <span class="goal" id="goalAt">목표 20:30</span>
    </div>
    <div class="t-main">
      <div class="t-count">
        <span class="count" id="countdown">00:00:00</span>
        <span class="count-side">
          <span class="count-label" id="countLabel">남은 시간</span>
          <span class="count-sub" id="countSub">20:30까지</span>
        </span>
      </div>
      <div class="prog">
        <div class="prog-top"><b id="doneNum">0</b><span class="slash">/</span><span class="tot" id="totalNum">5</span><span class="prog-label">완료</span></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="track">
      <div class="fill" id="timeFill"></div>
      <span class="knob" id="starMark"></span>
    </div>
  </section>

  <div class="all-done" id="allDone" hidden>
    <span class="ad-emoji">🎉</span>
    <span id="allDoneText">오늘 저녁 공부 끝! 정말 잘했어요</span>
    <span class="ad-emoji">🎉</span>
  </div>

  <main class="cards" id="cards"></main>
</div>

<canvas id="confetti"></canvas>

<div class="backdrop" id="settingsBackdrop" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head">
      <h2 id="settingsTitle">⚙️ 설정</h2>
      <button class="x" id="closeSettings" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="panel-body">
      <div class="field">
        <label for="targetInput">저녁 목표 완료 시간</label>
        <div class="time-row">
          <input type="time" id="targetInput" value="20:30">
          <span class="sub">이 시간까지 다 끝내는 게 목표예요. 남은 시간이 줄어들며 표시돼요. (기본 20:30)</span>
        </div>
      </div>
      <div class="field">
        <label for="nameInput">이름 · 아바타</label>
        <div class="who-row">
          <input class="s-avatar" id="avatarInput" maxlength="8" aria-label="아바타 이모지">
          <input class="s-name" id="nameInput" maxlength="14" aria-label="이름">
        </div>
      </div>
      <div class="field">
        <label>저녁 할일 · 그림 카드</label>
        <span class="sub">그림칸을 누르면 5가지 그림 중에서 고를 수 있어요. 그림 대신 이모지도 쓸 수 있어요.</span>
        <div id="settingsItems" class="s-items"></div>
        <button type="button" class="s-add" id="addItemBtn">＋ 할일 추가</button>
      </div>
    </div>
    <div class="panel-foot">
      <button class="btn ghost mini" id="restoreBtn" type="button">기본값 복원</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="cancelBtn" type="button">취소</button>
      <button class="btn primary" id="saveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<div class="ipop" id="iconPop" hidden></div>

<div class="toast" id="toast"></div>

  function esc(s) {

  }

  function tone(ctx, freq, at, dur, vol, type) {

    o.start(t); o.stop(t + dur + 0.06);
  }

  function burst(x, y, n, colors) {
    var c = colors || ["#34A9F5", "#2FD3A8", "#FFC93C", "#FF8A5B", "#B08BFF"];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 3 + Math.random() * 9;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 6,
        r: 3 + Math.random() * 6,
        rot: Math.random() * Math.PI,

        color: c[Math.floor(Math.random() * c.length)],

    }
    if (parts.length > 700) parts = parts.slice(-700);
    if (!rafId) rafId = requestAnimationFrame(draw);
  }
  function draw() {
    ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.32;
      p.vx *= 0.995;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > window.innerHeight + 60) { parts.splice(i, 1); continue; }
      ctx2d.save();
      ctx2d.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx2d.translate(p.x, p.y);
      ctx2d.rotate(p.rot);
      ctx2d.fillStyle = p.color;
      if (p.round) {
        ctx2d.beginPath(); ctx2d.arc(0, 0, p.r * 0.62, 0, Math.PI * 2); ctx2d.fill();
      } else {
        ctx2d.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.66);
      }
      ctx2d.restore();
    }
    if (parts.length) { rafId = requestAnimationFrame(draw); }
    else { rafId = null; ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }
  function centerOf(node) {
    var r = node.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function stars(x, y) {
    var glyphs = ["✨", "⭐", "💫"];
    for (var i = 0; i < 3; i++) {
      var s = document.createElement("span");
      s.className = "star-pop";
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      s.style.left = (x + (Math.random() - 0.5) * 46) + "px";
      s.style.top = (y + (Math.random() - 0.5) * 16) + "px";
      document.body.appendChild(s);
      (function (node) { setTimeout(function () { node.remove(); }, 950); })(s);
    }
  }

  /* ---------------- data helpers ---------------- */
  function items() { return state.settings.child.items; }
  function countDone() {
    var n = 0;
    items().forEach(function (it) { if (state.checks[it.id]) n++; });
    return n;
  }
  function isAllDone() {
    var list = items();
    return list.length > 0 && countDone() === list.length;
  }

  /* ---------------- rendering: cards ---------------- */
  function mediaMarkup(it) {
    if (it.icon && PIC[it.icon]) {
      return '<span class="pic-media"><img src="' + PIC[it.icon] + '" alt="" draggable="false"></span>';
    }
    return '<span class="pic-media"><span class="em">' + esc(it.emoji) + '</span></span>';
  }

  function cardMarkup(it) {
    var on = !!state.checks[it.id];
    return '<button type="button" class="pic' + (on ? " on" : "") + '" data-item="' + esc(it.id) + '" data-tint="' + esc(it.tint) + '" aria-pressed="' + (on ? "true" : "false") + '" aria-label="' + esc(it.text) + '">' +
      mediaMarkup(it) +
      '<span class="pic-label">' + esc(it.text) + '</span>' +
      '<span class="pic-tint" aria-hidden="true"></span>' +
      '<span class="pic-badge" aria-hidden="true">✓</span>' +
      '</button>';
  }

  /* 화면에 꽉 차게: 가로는 3+2, 세로는 2+2+1 로 나눠 배치해요 */
  function layoutCards() {
    var n = items().length;
    if (!n) return;
    var w = window.innerWidth, h = window.innerHeight;
    var cols;
    if (w < 640) cols = 1;
    else if (w >= 760 && w > h) cols = Math.min(3, n);
    else cols = Math.min(2, n);
    var rows = Math.ceil(n / cols);
    var units = cols * 2;

    if (cols === 1) {
      cardsEl.classList.add("narrow");
      cardsEl.style.gridTemplateColumns = "1fr";
      cardsEl.style.gridTemplateRows = "";
    } else {
      cardsEl.classList.remove("narrow");
      cardsEl.style.gridTemplateColumns = "repeat(" + units + ", minmax(0,1fr))";
      cardsEl.style.gridTemplateRows = "repeat(" + rows + ", minmax(0,1fr))";
    }

    /* 줄마다 카드 수를 고르게 나누고, 그 줄 폭을 꽉 채우도록 span 을 줘요 */
    var per = [], left = n, r = rows;
    for (var i = 0; i < rows; i++) {
      var k = Math.ceil(left / (rows - i));
      per.push(k);
      left -= k;
    }
    var els = cardsEl.querySelectorAll(".pic");
    var idx = 0;
    for (var i2 = 0; i2 < rows; i2++) {
      var k2 = per[i2];
      var span = Math.max(1, Math.round(units / k2));
      for (var j = 0; j < k2 && idx < els.length; j++, idx++) {
        els[idx].style.gridColumn = "span " + span;
      }
    }
  }

  function renderCards() {
    var list = items();
    if (!list.length) {
      cardsEl.innerHTML = '<div class="s-empty">설정에서 저녁 할일을 추가해 주세요</div>';
      paintDots();
      return;
    }
    cardsEl.innerHTML = list.map(cardMarkup).join("");
    layoutCards();
    paintDots();
  }

  function paintDots() {
    var list = items();
    dotsEl.innerHTML = list.map(function (it) {
      var on = !!state.checks[it.id];
      var inner = (it.icon && PIC[it.icon])
        ? '<img src="' + PIC[it.icon] + '" alt="" draggable="false">'
        : '<span class="em">' + esc(it.emoji) + '</span>';
      return '<span class="dot-chip' + (on ? " on" : "") + '" title="' + esc(it.text) + '">' + inner + '</span>';
    }).join("");
  }

  function paintWho() {
    whoName.textContent = state.settings.child.name;
    whoAvatar.textContent = state.settings.child.avatar;
    document.title = state.settings.child.name + " 저녁 공부 대시보드";
  }

  /* ---------------- progress / banner ---------------- */
  var bannerWasOn = false;
  var previewBannerUntil = 0;

  function refreshBanner(silent) {
    var done = isAllDone();
    var previewing = Date.now() < previewBannerUntil;
    var show = done || previewing;
    allDone.hidden = !show;
    if (show) {
      allDoneText.textContent = vocative(state.settings.child.name) + ", 오늘 저녁 공부 끝! 정말 잘했어요";
    }
    if (done && !bannerWasOn && !silent) {
      sfxAllDone();
      var w = window.innerWidth, h = window.innerHeight;
      burst(w * 0.5, h * 0.3, 150);
      setTimeout(function () { burst(w * 0.16, h * 0.52, 80); }, 160);
      setTimeout(function () { burst(w * 0.84, h * 0.52, 80); }, 320);
    }
    bannerWasOn = done;
  }

  function paintProgress(silent) {
    var total = items().length;
    var done = countDone();
    var pct = total ? Math.round((done / total) * 100) : 0;
    doneNum.textContent = String(done);
    totalNum.textContent = String(total);
    timeFill.style.width = pct + "%";
    starMark.style.left = pct + "%";
    starMark.style.transform = pct >= 99 ? "translate(-100%,-50%)" : (pct <= 1 ? "translate(0,-50%)" : "translate(-50%,-50%)");
    starMark.style.opacity = done > 0 ? "1" : ".5";
    starMark.classList.toggle("at-end", pct >= 99);
    paintDots();
    var remain = total - done;
    hintText.innerHTML = remain > 0
      ? "남은 할일 <b>" + remain + "개</b> · " + state.settings.child.name
      : "<b>모두 끝났어요</b> · " + state.settings.child.name;
    refreshBanner(silent);
  }

  /* ---------------- clock / countdown ---------------- */
  var previewTarget = null;

  function targetTime(now) {
    if (previewTarget) return new Date(previewTarget);
    var parts = String(state.settings.target).split(":");
    var t = new Date(now.getTime());
    t.setHours(parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);
    return t;
  }

  function phaseOf(diff) {
    if (diff > 60 * 60000) return "calm";
    if (diff > 20 * 60000) return "warn";
    if (diff > 0) return "hurry";
    if (diff > -30 * 60000) return "late";
    return "over";
  }
  var PHASE_TEXT = {
    calm: "여유 있어요",
    warn: "슬슬 시작해요",
    hurry: "서둘러요!",
    late: "목표 시간이에요",
    over: "잘 시간이에요"
  };

  function tick() {
    var now = new Date();

    if (state.day !== todayKey(now)) {
      state.day = todayKey(now);
      state.checks = {};
      saveState();
      renderCards();
      paintProgress(true);
      showToast("날짜가 바뀌어 체크를 새로 시작했어요");
    }

    dateText.textContent = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + dayFmt[now.getDay()];
    clockText.textContent = pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());

    var target = targetTime(now);
    var diff = target.getTime() - now.getTime();
    var doneAll = isAllDone();
    var phase = doneAll ? "done" : phaseOf(diff);

    timerCard.setAttribute("data-phase", phase);
    statusText.textContent = doneAll ? "오늘 완료!" : PHASE_TEXT[phase];

    var remainTxt = diff >= 0 ? hms(diff) : hms(-diff);

    if (doneAll) {
      countdown.textContent = "완료!";
      countdown.classList.add("is-word");
      countLabel.textContent = "오늘 저녁 공부 끝";
      countSub.textContent = diff >= 0
        ? hhmm(target) + "까지 " + humanGap(diff) + " 남았어요"
        : hhmm(target) + "에서 " + humanGap(-diff) + " 지났어요";
    } else {
      countdown.classList.remove("is-word");
      if (diff >= 0) {
        countdown.textContent = remainTxt;
        countLabel.textContent = "남은 시간";
        countSub.textContent = hhmm(target) + "까지";
      } else {
        countdown.textContent = "+" + remainTxt;
        countLabel.textContent = "지난 시간";
        countSub.textContent = hhmm(target) + " 목표를 넘겼어요";
      }
    }

    goalAt.textContent = "목표 " + hhmm(target);
    previewFlag.hidden = !previewTarget;
    refreshBanner(true);
  }

  setInterval(tick, 250);

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  /* ---------------- picture card interactions ---------------- */
  cardsEl.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".pic") : null;
    if (!btn) return;
    var itemId = btn.getAttribute("data-item");
    var target = null;
    items().forEach(function (it) { if (it.id === itemId) target = it; });
    if (!target) return;

    var on = !state.checks[itemId];
    if (on) state.checks[itemId] = true; else delete state.checks[itemId];

    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.classList.remove("is-pop");
    void btn.offsetWidth;
    btn.classList.add("is-pop");

    saveState();
    paintProgress();
    tick();

    var box = btn.getBoundingClientRect();
    if (on) {
      stars(box.left + box.width * 0.2, box.top + box.height * 0.34);
      sfxCheck();
      if (isAllDone()) {
        var c = centerOf(btn);
        burst(c.x, c.y, 60);
      }
    } else {
      sfxUncheck();
    }
  });

  /* ---------------- preview ---------------- */
  previewBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    previewPop.hidden = !previewPop.hidden;
  });
  previewPop.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.getAttribute("data-celebrate") === "1") {
      previewBannerUntil = Date.now() + 6000;
      refreshBanner(true);
      sfxAllDone();
      var w = window.innerWidth, h = window.innerHeight;
      burst(w * 0.5, h * 0.3, 150);
      setTimeout(function () { burst(w * 0.16, h * 0.52, 80); }, 150);
      setTimeout(function () { burst(w * 0.84, h * 0.52, 80); }, 300);
      setTimeout(function () { refreshBanner(true); }, 6100);
      showToast("완료 축하 화면을 미리 보여드려요");
      previewPop.hidden = true;
      return;
    }
    var v = b.getAttribute("data-min");
    if (v === "off") {
      previewTarget = null;
      previewBtn.classList.remove("active");
      previewBtn.textContent = "🧪 미리보기";
      showToast("미리보기를 껐어요");
    } else {
      var min = parseFloat(v);
      previewTarget = new Date(Date.now() + min * 60000).toISOString();
      previewBtn.classList.add("active");
      previewBtn.textContent = "🧪 미리보기 중";
      showToast(min < 0 ? "목표 시간을 " + Math.abs(min) + "분 넘긴 상태로 보여드려요" : min + "분 전 상태로 보여드려요");
    }
    previewPop.hidden = true;
    tick();
  });
  document.addEventListener("click", function (e) {
    if (!previewPop.hidden && !previewPop.contains(e.target) && e.target !== previewBtn) {
      previewPop.hidden = true;
    }
  });

  /* ---------------- sound toggle ---------------- */
  function paintSoundBtn() {
    soundBtn.textContent = state.settings.soundOn ? "🔔 소리 켜짐" : "🔕 소리 꺼짐";
  }
  soundBtn.addEventListener("click", function () {
    state.settings.soundOn = !state.settings.soundOn;
    saveState();
    paintSoundBtn();
    if (state.settings.soundOn) sfxBlip();
    showToast(state.settings.soundOn ? "소리 알림을 켰어요" : "소리 알림을 껐어요");
  });

  /* ---------------- reset today ---------------- */
  resetBtn.addEventListener("click", function () {
    if (!window.confirm("오늘 체크한 내용을 모두 지울까요?")) return;
    state.checks = {};
    state.day = todayKey();
    saveState();
    renderCards();
    paintProgress(true);
    tick();
    showToast("오늘 체크를 모두 지웠어요");
  });

  /* ---------------- settings ---------------- */
  var draft = null;
  var pickIndex = null;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function openSettings() {
    draft = clone(state.settings);
    targetInput.value = draft.target;
    nameInput.value = draft.child.name;
    avatarInput.value = draft.child.avatar;
    paintDraft();
    backdrop.hidden = false;
    requestAnimationFrame(function () { backdrop.classList.add("show"); });
  }
  function closeSettings() {
    hideIconPop();
    backdrop.classList.remove("show");
    setTimeout(function () { backdrop.hidden = true; }, 200);
    draft = null;
  }

  function paintDraft() {
    settingsItems.innerHTML = draft.child.items.map(function (it, ii) {
      var inner = (it.icon && PIC[it.icon])
        ? '<img src="' + PIC[it.icon] + '" alt="" draggable="false">'
        : esc(it.emoji || "⭐");
      var cls = (it.icon && PIC[it.icon]) ? "s-icon" : "s-icon emoji-mode";
      return '<div class="s-item">' +
        '<button type="button" class="' + cls + '" data-ii="' + ii + '" aria-label="그림 선택">' + inner + '</button>' +
        '<input class="s-text" maxlength="30" value="' + esc(it.text) + '" aria-label="할일 내용">' +
        '<button type="button" class="s-del" data-ii="' + ii + '" aria-label="삭제">✕</button>' +
        '</div>';
    }).join("");
    if (!draft.child.items.length) {
      settingsItems.innerHTML = '<p class="s-empty">할일이 없어요. 아래 버튼으로 추가해 주세요.</p>';
    }
  }

  /* 목록에서 바뀐 글자만 draft 로 옮겨요 (그림 정보는 draft 에 그대로 둡니다) */
  function syncItems() {
    var rows = settingsItems.querySelectorAll(".s-item");
    var next = [];
    for (var r = 0; r < rows.length; r++) {
      var prev = draft.child.items[r] || packItem({}, r);
      next.push({
        id: prev.id,
        icon: prev.icon,
        emoji: prev.emoji,
        tint: prev.tint,
        text: rows[r].querySelector(".s-text").value
      });
    }
    draft.child.items = next;
  }

  /* ---- 그림 고르기 팝업 ---- */
  function buildIconPop() {
    var html = '<div class="ipop-t">그림 고르기</div><div class="ipop-grid">';
    PIC_META.forEach(function (m) {
      html += '<button type="button" class="ipick" data-key="' + m.key + '">' +
        '<img src="' + PIC[m.key] + '" alt="" draggable="false"><span>' + m.label + '</span></button>';
    });
    html += '</div><div class="ipop-emoji"><span>이모지</span>' +
      '<input type="text" class="ipop-in" maxlength="8" aria-label="이모지 직접 입력" placeholder="📖">' +
      '<button type="button" class="ipop-x">닫기</button></div>';
    iconPop.innerHTML = html;
  }
  buildIconPop();

  function hideIconPop() {
    iconPop.hidden = true;
    pickIndex = null;
  }

  function showIconPop(btn) {
    pickIndex = parseInt(btn.getAttribute("data-ii"), 10);
    var it = draft.child.items[pickIndex];
    if (!it) return;
    iconPop.querySelectorAll(".ipick").forEach(function (b) {
      b.classList.toggle("sel", b.getAttribute("data-key") === it.icon);
    });
    iconPop.querySelector(".ipop-in").value = it.icon ? "" : (it.emoji || "");
    iconPop.hidden = false;
  }

  iconPop.addEventListener("click", function (e) {
    var tile = e.target.closest(".ipick");
    if (tile && pickIndex !== null) {
      var key = tile.getAttribute("data-key");
      syncItems();
      var it = draft.child.items[pickIndex];
      if (it) {
        it.icon = key;
        if (!String(it.text || "").trim()) it.text = PIC_LABEL[key] || it.text;
      }
      paintDraft();
      hideIconPop();
      return;
    }
    if (e.target.closest(".ipop-x")) hideIconPop();
  });

  iconPop.querySelector(".ipop-in").addEventListener("input", function () {
    if (pickIndex === null) return;
    syncItems();
    var it = draft.child.items[pickIndex];
    if (!it) return;
    it.icon = "";
    it.emoji = this.value.trim() || "⭐";
    var btn = settingsItems.querySelector('.s-icon[data-ii="' + pickIndex + '"]');
    if (btn) {
      btn.className = "s-icon emoji-mode";
      btn.textContent = it.emoji;
    }
    iconPop.querySelectorAll(".ipick").forEach(function (b) { b.classList.remove("sel"); });
  });

  document.addEventListener("click", function (e) {
    if (!iconPop.hidden && !iconPop.contains(e.target) && !e.target.closest(".s-icon")) hideIconPop();
  });

  settingsItems.addEventListener("click", function (e) {
    var icon = e.target.closest(".s-icon");
    if (icon) {
      syncItems();
      showIconPop(icon);
      return;
    }
    var del = e.target.closest(".s-del");
    if (del) {
      syncItems();
      var ii = parseInt(del.getAttribute("data-ii"), 10);
      draft.child.items.splice(ii, 1);
      hideIconPop();
      paintDraft();
    }
  });

  el("addItemBtn").addEventListener("click", function () {
    if (draft.child.items.length >= MAX_ITEMS) {
      showToast("할일은 " + MAX_ITEMS + "개까지 넣을 수 있어요");
      return;
    }
    syncItems();
    var i = draft.child.items.length;
    draft.child.items.push({ id: uid(), icon: "", emoji: "⭐", text: "", tint: TINTS[i % TINTS.length] });
    paintDraft();
    var last = settingsItems.querySelectorAll(".s-text");
    if (last.length) last[last.length - 1].focus();
  });

  settingsBtn.addEventListener("click", openSettings);
  el("closeSettings").addEventListener("click", closeSettings);
  el("cancelBtn").addEventListener("click", closeSettings);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeSettings(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!iconPop.hidden) { hideIconPop(); return; }
    if (!backdrop.hidden) closeSettings();
  });
  window.addEventListener("resize", function () { if (!iconPop.hidden) hideIconPop(); });
  backdrop.addEventListener("scroll", function () { if (!iconPop.hidden) hideIconPop(); }, true);

  el("restoreBtn").addEventListener("click", function () {
    if (!window.confirm("이름·그림 카드·목표 시간을 기본값으로 되돌릴까요? (저장을 눌러야 적용돼요)")) return;
    draft = normalize(defaults());
    targetInput.value = draft.target;
    nameInput.value = draft.child.name;
    avatarInput.value = draft.child.avatar;
    hideIconPop();
    paintDraft();
    showToast("기본값을 불러왔어요. 저장을 눌러 주세요");
  });

  el("saveBtn").addEventListener("click", function () {
    syncItems();

    var list = draft.child.items
      .filter(function (it) { return String(it.text || "").trim() !== ""; })
      .map(function (it, i) {
        return {
          id: it.id,
          icon: it.icon,
          emoji: it.emoji,
          tint: it.tint || TINTS[i % TINTS.length],
          text: String(it.text).trim()
        };
      });

    var candidate = {
      target: targetInput.value || "20:30",
      soundOn: state.settings.soundOn,
      child: {
        id: "c1",
        name: String(nameInput.value || "").trim() || defaults().child.name,
        avatar: String(avatarInput.value || "").trim() || "⭐",
        items: list
      }
    };
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(candidate.target)) candidate.target = "20:30";

    state.settings = normalize(candidate);

    var keep = {};
    state.settings.child.items.forEach(function (it) { if (state.checks[it.id]) keep[it.id] = true; });
    state.checks = keep;

    saveState();
    closeSettings();
    paintWho();
    renderCards();
    paintProgress(true);
    tick();
    showToast("저장했어요! 다음에 열어도 그대로예요");
  });

  /* ---------------- boot ---------------- */
  paintSoundBtn();
  paintWho();
  renderCards();
  paintProgress(true);
  tick();
  saveState();

  window.addEventListener("orientationchange", function () {
    setTimeout(layoutCards, 250);
  });
  window.addEventListener("resize", layoutCards);
})();
</script>
</body>
</html>
