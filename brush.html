<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3분 양치">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4FBF8">
<link rel="apple-touch-icon" href="brush-icon.png">
<link rel="icon" type="image/png" href="brush-icon.png">
<title>3분 양치 대시보드 · 유주·유현</title>
<style>
  :root{
    --ink:#182338;
    --ink-soft:#586A87;
    --ink-mute:#93A2BA;
    --line:#E6EFF9;
    --card:#FFFFFF;
    --mint:#12BE92;
    --mint-deep:#0A9A74;
    --mint-soft:rgba(18,190,146,.13);
    --peach:#FF9F45;
    --peach-soft:rgba(255,159,69,.16);
    --lilac:#9E8BFF;
    --sky:#79B4FF;
    --gap:clamp(8px, 1.2vh, 16px);
    --r-lg:clamp(20px, 2.6vh, 32px);
    --r-md:clamp(14px, 1.8vh, 22px);
    --shadow:0 20px 46px -24px rgba(24,42,86,.34), 0 4px 14px -8px rgba(24,42,86,.10);
    --shadow-sm:0 10px 22px -14px rgba(24,42,86,.30);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }

  html,body{ margin:0; padding:0; height:100%; }
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Helvetica Neue", Arial, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 640px at 2% -12%, #E2F7F0 0%, rgba(226,247,240,0) 62%),
      radial-gradient(900px 560px at 102% -10%, #FFEDDD 0%, rgba(255,237,221,0) 60%),
      radial-gradient(1000px 760px at 50% 118%, #E8E6FF 0%, rgba(232,230,255,0) 62%),
      #F6FBF9;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  body::before, body::after{
    content:""; position:fixed; z-index:0; border-radius:50%; filter:blur(48px); opacity:.5; pointer-events:none;
  }
  body::before{ width:34vw; height:34vw; left:-10vw; top:44vh; background:radial-gradient(circle,#BFEFE1,transparent 70%); }
  body::after{ width:30vw; height:30vw; right:-8vw; bottom:-8vw; background:radial-gradient(circle,#FFD9BC,transparent 70%); }

  .app{
    position:relative; z-index:1;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    gap:var(--gap);
    padding:clamp(8px,1.4vh,18px) clamp(12px,2vw,28px) clamp(10px,1.6vh,20px);
    padding-top:calc(clamp(8px,1.4vh,18px) + env(safe-area-inset-top));
    padding-bottom:calc(clamp(10px,1.6vh,20px) + env(safe-area-inset-bottom));
    max-width:1500px; margin:0 auto;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    min-height:clamp(36px,5vh,52px);
  }
  .brand{ display:flex; align-items:center; gap:clamp(8px,1vw,14px); min-width:0; }
  .brand .bemoji{ font-size:clamp(24px,3.4vh,38px); line-height:1; filter:drop-shadow(0 6px 10px rgba(18,190,146,.22)); }
  .brand .btxt{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .brand .btitle{ font-size:clamp(18px,2.6vh,30px); font-weight:900; letter-spacing:-.02em; white-space:nowrap; }
  .brand .bsub{ font-size:clamp(11px,1.5vh,15px); font-weight:700; color:var(--ink-mute); white-space:nowrap; }
  .chips{ display:flex; align-items:center; gap:clamp(6px,.8vw,10px); flex-wrap:wrap; justify-content:flex-end; }
  .chip{
    appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    font-family:inherit; font-weight:800; font-size:clamp(12px,1.7vh,17px);
    padding:clamp(7px,1.2vh,12px) clamp(11px,1.3vw,18px); border-radius:999px;
    box-shadow:var(--shadow-sm); cursor:pointer; white-space:nowrap;
    transition:transform .12s ease, background .18s ease, color .18s ease;
  }
  .chip:active{ transform:scale(.97); }
  .chip.on{ background:var(--mint-soft); color:var(--mint-deep); border-color:rgba(18,190,146,.28); }
  .chip.settings{ background:linear-gradient(135deg,#8E7BFF,#6E5BF0); color:#fff; border-color:transparent; box-shadow:0 12px 22px -14px rgba(110,91,240,.9); }

  /* ---------- stage ---------- */
  .stage{
    flex:1 1 auto; min-height:0;
    display:grid; gap:var(--gap);
    grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);
  }
  .card{
    background:linear-gradient(180deg,#FFFFFF 0%,#FCFEFF 100%);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.9);
    position:relative;
  }

  /* ---------- timer card ---------- */
  .timerCard{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(6px,1.2vh,16px);
    padding:clamp(10px,1.8vh,24px);
    overflow:hidden;
  }
  .ringWrap{
    width:min(100%, 44vh, 48vw);
    aspect-ratio:1/1;
    position:relative; flex:0 0 auto;
  }
  .ring{ width:100%; height:100%; display:block; transform:rotate(0deg); }
  .ring-track{ fill:none; stroke:#EAF3F8; stroke-width:15; }
  .ring-fill{
    fill:none; stroke:url(#ringGrad); stroke-width:15; stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .12s linear, stroke .4s ease;
  }
  .ringDots circle{ fill:#DDE9F2; transition:fill .3s ease, r .3s ease; }
  .ringDots circle.done{ fill:var(--mint); }
  .ringDots circle.now{ fill:var(--peach); }
  .ringCenter{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(2px,.5vh,6px); pointer-events:none;
  }
  .time{
    font-size:clamp(44px, 9vh, 88px);
    font-weight:900; letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    color:var(--ink); line-height:1;
    transition:color .35s ease, transform .18s ease;
  }
  .timeLabel{ font-size:clamp(11px,1.5vh,15px); font-weight:800; color:var(--ink-mute); letter-spacing:.02em; }
  .timerCard.paused .time{ color:var(--peach); }
  .timerCard.paused .ring-center{ opacity:.92; }
  .ringWrap.finish .time{ color:var(--mint-deep); }
  .tickPulse .time{ animation:timePop .9s ease-in-out infinite; }
  @keyframes timePop{
    0%,100%{ transform:scale(1); }
    35%{ transform:scale(1.09); }
  }

  .side{ display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1vh,12px); width:100%; min-width:0; }
  .status{
    display:inline-flex; align-items:center; gap:8px;
    font-size:clamp(12px,1.8vh,18px); font-weight:800; color:var(--mint-deep);
    background:var(--mint-soft); border-radius:999px;
    padding:clamp(5px,.9vh,9px) clamp(12px,1.3vw,18px);
    white-space:nowrap; max-width:100%;
  }
  .status .dot{
    width:.62em; height:.62em; border-radius:50%; background:var(--mint); flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(18,190,146,.16);
  }
  .status.paused{ background:var(--peach-soft); color:#B96A17; }
  .status.paused .dot{ background:var(--peach); box-shadow:0 0 0 4px rgba(255,159,69,.18); }
  .status.idle{ background:#EFF4FA; color:#6C7C96; }
  .status.idle .dot{ background:#B9C7D8; box-shadow:0 0 0 4px rgba(185,199,216,.18); }
  .status.done{ background:rgba(18,190,146,.16); color:var(--mint-deep); }

  .controls{
    width:100%;
    display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:clamp(6px,.8vw,10px);
    margin-top:clamp(2px,.6vh,8px);
  }
  .btn{
    appearance:none; border:0; border-radius:999px; font-family:inherit; font-weight:900;
    font-size:clamp(14px,1.95vh,22px); cursor:pointer;
    padding:clamp(10px,1.7vh,20px) clamp(8px,1vw,18px);
    display:inline-flex; align-items:center; justify-content:center; gap:.4em;
    transition:transform .1s ease, filter .2s ease, box-shadow .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{
    background:linear-gradient(180deg,#2AD3A8 0%,#0DA87C 100%);
    color:#fff; box-shadow:0 16px 30px -14px rgba(13,168,124,.85);
  }
  .btn.pause{
    background:linear-gradient(180deg,#FFCB7D 0%,#FF9B3D 100%);
    color:#5D3400; box-shadow:0 16px 30px -16px rgba(255,155,61,.9);
  }
  .btn.ghost{ background:#EEF3FB; color:#47597A; box-shadow:inset 0 0 0 1px rgba(71,89,122,.06); }
  .btn:disabled{ opacity:.38; box-shadow:none; cursor:default; filter:saturate(.6); }
  .btn:disabled:active{ transform:none; }

  /* ---------- step card ---------- */
  .stepCard{
    display:flex; flex-direction:column;
    padding:clamp(10px,1.6vh,22px);
    gap:clamp(6px,1vh,14px);
    overflow:hidden;
  }
  .stepHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto; }
  .stepPill{
    display:inline-flex; align-items:center; gap:.45em;
    font-size:clamp(12px,1.7vh,17px); font-weight:900; color:var(--mint-deep);
    background:var(--mint-soft); border-radius:999px; padding:clamp(5px,.8vh,9px) clamp(10px,1.1vw,16px);
    white-space:nowrap;
  }
  .stepPill b{ font-size:1.12em; }
  .stepEta{
    font-size:clamp(12px,1.7vh,17px); font-weight:900; color:var(--ink-soft);
    background:#F1F6FB; border-radius:999px; padding:clamp(5px,.8vh,9px) clamp(10px,1.1vw,16px);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .picWrap{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .picWrap img{
    max-width:100%; max-height:100%;
    border-radius:var(--r-md);
    object-fit:contain; aspect-ratio:1/1;
    box-shadow:0 22px 40px -26px rgba(24,42,86,.42);
    transition:opacity .28s ease, transform .35s ease;
    background:#fff;
  }
  .picWrap.swap img{ animation:picSwap .55s ease; }
  @keyframes picSwap{
    0%{ opacity:.2; transform:scale(.965) rotate(-1.2deg); }
    60%{ opacity:1; transform:scale(1.012) rotate(.3deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }
  .stepName{
    flex:0 0 auto; text-align:center;
    font-size:clamp(24px,4.2vh,46px); font-weight:900; letter-spacing:-.03em;
    color:var(--ink); line-height:1.12;
  }
  .stepHint{
    flex:0 0 auto; text-align:center;
    font-size:clamp(13px,1.85vh,20px); font-weight:700; color:var(--ink-soft);
    line-height:1.3;
    margin-top:calc(-1 * clamp(2px,.4vh,6px));
  }
  .stepBar{
    flex:0 0 auto; display:grid; grid-template-columns:repeat(6,1fr); gap:clamp(4px,.5vw,7px);
    margin-top:clamp(1px,.4vh,6px);
  }
  .seg{
    height:clamp(9px,1.4vh,15px); border-radius:999px; background:#EDF3F9; overflow:hidden; position:relative;
  }
  .seg > i{
    position:absolute; inset:0; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#4BE0B8,#0FA57B);
    transition:width .12s linear;
  }
  .seg.done > i{ width:100% !important; background:linear-gradient(90deg,#3FD3AA,#0C9C76); }
  .seg.now > i{ background:linear-gradient(90deg,#FFC46B,#FF9F43); }

  /* ---------- bottom steps strip ---------- */
  .steps{
    flex:0 0 auto;
    display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:clamp(5px,.7vw,10px);
  }
  .stepChip{
    display:flex; align-items:center; gap:clamp(5px,.6vw,9px);
    background:rgba(255,255,255,.72);
    border:2px solid rgba(255,255,255,.9);
    border-radius:var(--r-md);
    padding:clamp(6px,.9vh,11px) clamp(6px,.7vw,12px);
    box-shadow:0 10px 22px -18px rgba(24,42,86,.4);
    transition:background .25s ease, border-color .25s ease, transform .25s ease, box-shadow .25s ease;
    min-width:0;
  }
  .stepChip .num{
    width:clamp(22px,2.9vh,32px); height:clamp(22px,2.9vh,32px); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(11px,1.55vh,16px); font-weight:900; color:#8496B0; background:#EDF3F9;
    flex:0 0 auto; transition:background .25s, color .25s;
  }
  .stepChip .lbl{
    font-size:clamp(11px,1.55vh,16px); font-weight:800; color:var(--ink-mute);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .stepChip.now{
    background:#fff; border-color:rgba(255,159,69,.55);
    box-shadow:0 16px 26px -18px rgba(255,159,69,.8); transform:translateY(-2px);
  }
  .stepChip.now .num{ background:linear-gradient(180deg,#FFCB7D,#FF9B3D); color:#5D3400; }
  .stepChip.now .lbl{ color:#B96A17; }
  .stepChip.done{ background:rgba(18,190,146,.10); border-color:rgba(18,190,146,.30); }
  .stepChip.done .num{ background:var(--mint); color:#fff; }
  .stepChip.done .lbl{ color:var(--mint-deep); }

  /* ---------- celebration ---------- */
  .celebrate{
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(14px,3vw,40px);
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.82), rgba(226,247,240,.72) 60%, rgba(232,230,255,.66));
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .celCard{
    position:relative; text-align:center;
    background:linear-gradient(180deg,#FFFFFF,#F7FFFC);
    border-radius:clamp(26px,4vh,46px);
    padding:clamp(22px,4vh,48px) clamp(24px,5vw,70px);
    box-shadow:0 40px 80px -40px rgba(13,120,92,.55), 0 10px 30px -16px rgba(24,42,86,.25);
    border:2px solid rgba(255,255,255,.9);
    animation:popIn .5s cubic-bezier(.2,1.5,.5,1);
    max-width:min(90vw, 760px);
  }
  @keyframes popIn{ 0%{ transform:scale(.86); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .celCard .tooth{ font-size:clamp(54px,11vh,110px); line-height:1; animation:toothBob 1.6s ease-in-out infinite; }
  @keyframes toothBob{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-8px) rotate(2deg); } }
  .celCard h2{
    margin:clamp(6px,1.4vh,16px) 0 clamp(4px,.8vh,10px);
    font-size:clamp(30px,6.4vh,68px); font-weight:900; letter-spacing:-.04em; color:var(--mint-deep);
  }
  .celCard p{
    margin:0 0 clamp(14px,2.4vh,26px);
    font-size:clamp(14px,2.2vh,24px); font-weight:800; color:var(--ink-soft);
  }
  .celCard .btn{ padding:clamp(14px,2.2vh,22px) clamp(24px,3vw,44px); font-size:clamp(17px,2.5vh,28px); }
  .spark{
    position:absolute; font-size:clamp(22px,4vh,40px); animation:sparkle 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sparkle{ 0%,100%{ opacity:.35; transform:scale(.85) rotate(-8deg); } 50%{ opacity:1; transform:scale(1.15) rotate(8deg); } }
  #confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:41; }

  /* ---------- modal ---------- */
  .modal{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(14px,3vw,40px);
    background:rgba(24,35,56,.34);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    animation:fadeIn .2s ease;
  }
  .sheet{
    width:min(92vw, 640px);
    background:linear-gradient(180deg,#FFFFFF,#FAFDFF);
    border-radius:clamp(22px,3.2vh,34px);
    padding:clamp(18px,3vh,34px);
    box-shadow:0 40px 80px -40px rgba(24,42,86,.6);
    animation:popIn .3s cubic-bezier(.2,1.4,.5,1);
  }
  .sheet h3{
    margin:0 0 clamp(12px,2vh,22px);
    font-size:clamp(20px,2.9vh,30px); font-weight:900; letter-spacing:-.02em;
  }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:clamp(8px,1.4vw,18px);
    padding:clamp(8px,1.4vh,14px) 0;
    border-top:1px solid var(--line); flex-wrap:wrap;
  }
  .row:first-of-type{ border-top:0; }
  .rowLabel{ font-size:clamp(14px,2vh,21px); font-weight:900; color:var(--ink); }
  .segs{ display:flex; gap:8px; flex-wrap:wrap; }
  .segs button{
    appearance:none; border:2px solid var(--line); background:#fff; color:var(--ink-soft);
    font-family:inherit; font-weight:900; font-size:clamp(13px,1.9vh,19px);
    padding:clamp(8px,1.2vh,13px) clamp(14px,1.6vw,22px); border-radius:999px;
    cursor:pointer; transition:all .18s ease; white-space:nowrap;
  }
  .segs button:active{ transform:scale(.97); }
  .segs button.sel{
    background:var(--mint-soft); border-color:rgba(18,190,146,.5); color:var(--mint-deep);
    box-shadow:0 10px 20px -16px rgba(18,190,146,.9);
  }
  .tip{
    margin:clamp(8px,1.4vh,16px) 0 clamp(12px,2vh,20px);
    font-size:clamp(12px,1.7vh,17px); font-weight:700; color:var(--ink-mute); line-height:1.4;
  }
  .sheet .btn.wide{ width:100%; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translate(-50%, 18px);
    background:rgba(24,35,56,.92); color:#fff;
    font-size:clamp(13px,1.8vh,18px); font-weight:800;
    padding:clamp(9px,1.3vh,14px) clamp(16px,2vw,26px);
    border-radius:999px; z-index:60;
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- portrait / narrow ---------- */
  @media (max-aspect-ratio: 1/1){
    .stage{ grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
    .timerCard{ flex-direction:row; justify-content:center; gap:clamp(10px,2vw,22px); padding:clamp(10px,1.6vh,18px); }
    .ringWrap{ width:min(38vw, 30vh); }
    .side{ display:flex; flex-direction:column; gap:clamp(6px,1vh,12px); flex:1 1 auto; min-width:0; max-width:min(52%, 380px); }
    .controls{ grid-template-columns:1fr 1fr; }
    .controls .btn.primary{ grid-column:1 / -1; }
    .stepName{ font-size:clamp(22px,3.2vh,38px); }
    .stepChip{ justify-content:center; padding:clamp(6px,.9vh,10px) 4px; }
    .stepChip .lbl{ display:none; }
    .stepChip .num{ width:clamp(24px,3vh,34px); height:clamp(24px,3vh,34px); }
  }
  @media (max-height: 620px) and (min-aspect-ratio: 1/1){
    .brand .bsub{ display:none; }
    .stepHint{ display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="bemoji">🪥</span>
      <span class="btxt">
        <span class="btitle">3분 양치</span>
        <span class="bsub">유주·유현 이를 반짝반짝</span>
      </span>
    </div>
    <div class="chips">
      <button class="chip on" id="soundBtn" type="button">🔔 소리 켜짐</button>
      <button class="chip settings" id="settingsBtn" type="button">⚙️ 설정</button>
    </div>
  </header>

  <main class="stage">
    <section class="card timerCard" id="timerCard" aria-label="양치 타이머">
      <div class="ringWrap" id="ringWrap">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4BE0B8"/>
              <stop offset="100%" stop-color="#0FA57B"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="110" cy="110" r="96"/>
          <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="96"/>
          <g class="ringDots" id="ringDots"></g>
        </svg>
        <div class="ringCenter">
          <div class="time" id="timeTxt">3:00</div>

    started: false,    // 시작을 한 번이라도 눌렀는지
    step: 0,
    lastTick: -1
  };

  /* ====== 저장/불러오기 ====== */
  function loadSettings(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && typeof o === "object"){
        if ([2,3,4].indexOf(Number(o.minutes)) >= 0) state.settings.minutes = Number(o.minutes);
        if (typeof o.soundOn === "boolean") state.settings.soundOn = o.soundOn;
        else if (o.soundOn === "off") state.settings.soundOn = false;
      }
    } catch(e){}
  }
  function saveSettings(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ minutes: state.settings.minutes, soundOn: state.settings.soundOn })); } catch(e){}
  }

  /* ====== 소리 (아이패드 사파리 무음 모드에서도 나도록 인라인 WAV + HTMLAudioElement) ====== */
  var sfxCache = {};
  function sfxPrep(){
    Object.keys(SFX_SRC).forEach(function(name){
      try {
        var a = new Audio(SFX_SRC[name]);
        a.preload = "auto";
        a.volume = name === "tick" ? 0.5 : 0.9;
        a.setAttribute("playsinline", "");
        a.setAttribute("webkit-playsinline", "");
        a.load();
        sfxCache[name] = a;
      } catch(e){}
    });
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
  }
  function playSfx(name){
    if (!state.settings.soundOn) return;
    var src = SFX_SRC[name];
    if (!src) return;
    try {
      var a = sfxCache[name];
      if (!a){ a = new Audio(src); a.preload = "auto"; sfxCache[name] = a; }
      try { a.currentTime = 0; } catch(e1){}
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
      return a;
    } catch(e){}
    return null;
  }
  sfxPrep();
  (function primeAudio(){
    var done = false;
    function prime(){
      if (done) return;
      done = true;
      document.removeEventListener("touchstart", prime, true);
      document.removeEventListener("pointerdown", prime, true);
      try {
        var a = new Audio(SFX_SRC.tick);
        a.muted = true;
        a.setAttribute("playsinline", "");
        var p = a.play();
        setTimeout(function(){ try { a.pause(); } catch(e){} }, 60);
        if (p && p.catch) p.catch(function(){});
      } catch(e){}
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
    }
    document.addEventListener("touchstart", prime, true);
    document.addEventListener("pointerdown", prime, true);
  })();

  /* ====== 화면 만들기 ====== */
  var stepsEl = el("steps"), stepBarEl = el("stepBar"), ringDotsEl = el("ringDots");
  var stepChips = [], segEls = [];

  STEPS.forEach(function(s, i){
    var chip = document.createElement("div");
    chip.className = "stepChip";
    chip.innerHTML = '<span class="num">' + s.no + '</span><span class="lbl">' + s.short + '</span>';
    stepsEl.appendChild(chip);
    stepChips.push(chip);

    var seg = document.createElement("div");
    seg.className = "seg";
    seg.innerHTML = "<i></i>";
    stepBarEl.appendChild(seg);
    segEls.push(seg);

    // 링 위의 단계 점 (12시 방향부터 시계 방향으로 6개)
    var ang = (-90 + i * (360 / N)) * Math.PI / 180;
    var cx = 110 + Math.cos(ang) * 96, cy = 110 + Math.sin(ang) * 96;
    var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", cx.toFixed(2));
    dot.setAttribute("cy", cy.toFixed(2));
    dot.setAttribute("r", "4.2");
    ringDotsEl.appendChild(dot);
  });
  var ringDots = Array.prototype.slice.call(ringDotsEl.querySelectorAll("circle"));

  var CIRC = 2 * Math.PI * 96;
  var ringFill = el("ringFill");
  ringFill.style.strokeDasharray = CIRC.toFixed(2);
  ringFill.style.strokeDashoffset = "0";

  /* ====== 렌더 ====== */
  var timeTxt = el("timeTxt"), timeLabel = el("timeLabel"), statusEl = el("status"), statusTxt = el("statusTxt");
  var startBtn = el("startBtn"), pauseBtn = el("pauseBtn"), resetBtn = el("resetBtn");
  var stepNo = el("stepNo"), stepEta = el("stepEta"), stepImg = el("stepImg");
  var stepName = el("stepName"), stepHint = el("stepHint"), picWrap = el("picWrap");
  var timerCard = el("timerCard"), ringWrap = el("ringWrap");

  function fmt(ms){
    var t = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(t / 60);
    var s = t % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }
  function secLabel(ms){
    var s = Math.round(ms / 1000);
    return s + "초";
  }
  function nowElapsed(){
    return state.elapsed + (state.running ? (performance.now() - state.runStart) : 0);
  }
  function stepLen(){ return state.totalMs / N; }

  function setStatus(kind, text){
    statusEl.className = "status " + kind;
    statusTxt.textContent = text;
  }

  function renderSteps(idx, stepProgress){
    for (var i = 0; i < N; i++){
      var chip = stepChips[i], seg = segEls[i], dot = ringDots[i];
      chip.className = "stepChip";
      seg.className = "seg";
      dot.setAttribute("class", "");
      seg.firstChild.style.width = "0%";
      if (i < idx){ chip.classList.add("done"); seg.classList.add("done"); dot.setAttribute("class", "done"); }
      else if (i === idx){
        chip.classList.add("now");
        seg.classList.add("now");
        dot.setAttribute("class", "now");
        seg.firstChild.style.width = (clamp(stepProgress, 0, 1) * 100).toFixed(1) + "%";
      }
    }
  }

  function showStep(i, animate){
    var s = STEPS[i];
    stepNo.textContent = s.no;
    stepName.textContent = s.name;
    stepHint.textContent = s.hint;
    var src = PICH["s" + s.no] || "";
    if (stepImg.getAttribute("src") !== src){
      stepImg.setAttribute("src", src);
      stepImg.alt = s.name + " 그림";
      if (animate){
        picWrap.classList.remove("swap");
        void picWrap.offsetWidth;
        picWrap.classList.add("swap");
      }
    }
  }

  function render(){
    var t = nowElapsed();
    var remain = Math.max(0, state.totalMs - t);
    var totalFrac = clamp(remain / state.totalMs, 0, 1);

    timeTxt.textContent = fmt(remain);
    ringFill.style.strokeDashoffset = (CIRC * (1 - totalFrac)).toFixed(2);

    var idx = clamp(Math.floor(t / stepLen()), 0, N - 1);
    var inStep = t - idx * stepLen();
    var stepProgress = clamp(inStep / stepLen(), 0, 1);

    if (!state.ended){
      if (state.running && t < state.totalMs - 1){
        var left = Math.ceil((stepLen() - inStep) / 1000);
        stepEta.textContent = left + "초 남음";
      } else {
        stepEta.textContent = secLabel(stepLen());
      }
    }

    // 단계 전환
    if (state.running && idx !== state.step && !state.ended){
      state.step = idx;
      showStep(idx, true);
      renderSteps(idx, stepProgress);
      if (state.started) playSfx("chime");
    } else {
      renderSteps(idx, stepProgress);
    }

    // 마지막 단계 마지막 3초: 또각또각
    if (state.running && idx === N - 1){
      var leftSec = Math.ceil(remain / 1000);
      if (leftSec <= 3 && leftSec >= 1 && leftSec !== state.lastTick){
        state.lastTick = leftSec;
        playSfx("tick");
      }
    }

    // 마무리 임박 펄스
    var finalSec = Math.ceil(remain / 1000);
    ringWrap.classList.toggle("tickPulse", state.running && finalSec <= 5 && finalSec >= 1);

    if (t >= state.totalMs && !state.ended) finish();
  }

  function updateButtons(){
    if (state.ended){
      startBtn.disabled = false;
      startBtn.innerHTML = "▶ 다시 시작";
      pauseBtn.disabled = true;
      return;
    }
    if (state.running){
      startBtn.disabled = true;
      startBtn.innerHTML = "▶ 닦는 중";
      pauseBtn.disabled = false;
      pauseBtn.innerHTML = "⏸ 일시정지";
    } else if (state.started){
      startBtn.disabled = false;
      startBtn.innerHTML = "▶ 계속하기";
      pauseBtn.disabled = true;
      pauseBtn.innerHTML = "⏸ 일시정지";
    } else {
      startBtn.disabled = false;
      startBtn.innerHTML = "▶ 시작";
      pauseBtn.disabled = true;
    }
  }

  /* ====== 타이머 제어 ====== */
  var intervalId = null;

  function startLoop(){
    if (intervalId) return;
    intervalId = setInterval(render, 100);
  }
  function stopLoop(){
    if (intervalId){ clearInterval(intervalId); intervalId = null; }
  }

  function start(){
    if (state.running) return;
    if (state.ended) reset(true);
    state.running = true;
    state.started = true;
    state.runStart = performance.now();
    state.lastTick = -1;
    timerCard.classList.remove("paused");
    setStatus("", "닦는 중이에요");
    timeLabel.textContent = "남은 시간";
    playSfx("pop");
    requestWakeLock();
    startLoop();
    updateButtons();
    render();
  }

  function pause(){
    if (!state.running) return;
    state.elapsed = nowElapsed();
    state.running = false;
    clearWakeLock();
    timerCard.classList.add("paused");
    setStatus("paused", "잠깐 쉬는 중이에요");
    timeLabel.textContent = "멈춘 시간";
    stopLoop();
    updateButtons();
    render();
  }

  function reset(silent){
    state.running = false;
    state.ended = false;
    state.started = false;
    state.elapsed = 0;
    state.runStart = 0;
    state.step = 0;
    state.lastTick = -1;
    state.totalMs = state.settings.minutes * 60000;
    timerCard.classList.remove("paused");
    ringWrap.classList.remove("finish", "tickPulse");
    el("celebrate").hidden = true;
    clearConfetti();
    setStatus("idle", "시작 버튼을 눌러요");
    timeLabel.textContent = "남은 시간";
    stopLoop();
    clearWakeLock();
    showStep(0, false);
    updateButtons();
    render();
    if (!silent) playSfx("tick");
  }

  function finish(){
    state.ended = true;
    state.running = false;
    state.elapsed = state.totalMs;
    state.step = N - 1;
    stopLoop();
    clearWakeLock();
    timerCard.classList.remove("paused");
    ringWrap.classList.remove("tickPulse");
    ringWrap.classList.add("finish");
    timeTxt.textContent = "0:00";
    ringFill.style.strokeDashoffset = CIRC.toFixed(2);
    timeLabel.textContent = "다 닦았어요";
    setStatus("done", "양치 완료!");
    renderSteps(N, 0);
    stepBarEl.querySelectorAll(".seg").forEach(function(s){ s.classList.add("done"); });
    updateButtons();
    playSfx("fanfare");
    el("celebrate").hidden = false;
    burstConfetti();
  }

  /* ====== 화면 잠금 방지 ====== */
  var wakeLock = null;
  function requestWakeLock(){
    try {
      if (!navigator.wakeLock || wakeLock) return;
      navigator.wakeLock.request("screen").then(function(lock){
        wakeLock = lock;
        lock.addEventListener("release", function(){ wakeLock = null; });
      }).catch(function(){});
    } catch(e){}
  }
  function clearWakeLock(){
    try { if (wakeLock){ wakeLock.release(); wakeLock = null; } } catch(e){}
  }

  /* ====== 축하 색종이 ====== */
  var canvas = el("confetti"), ctx = canvas.getContext("2d");
  var parts = [], confettiRaf = null, dpr = 1;
  function sizeCanvas(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  var COLORS = ["#2AD3A8","#7BE3C6","#FFCB7D","#FF9B3D","#A99BFF","#79B4FF","#FF8FB1"];
  function burstConfetti(){
    sizeCanvas();
    parts = [];
    var w = canvas.width, h = canvas.height;
    for (var i = 0; i < 150; i++){
      parts.push({
        x: Math.random() * w,
        y: -Math.random() * h * 0.6,
        vx: (Math.random() - 0.5) * 2.2 * dpr,
        vy: (1.6 + Math.random() * 3.2) * dpr,
        w: (5 + Math.random() * 9) * dpr,
        h: (7 + Math.random() * 13) * dpr,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.16,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1
      });
    }
    if (confettiRaf) cancelAnimationFrame(confettiRaf);
    var t0 = performance.now();
    function frame(now){
      var dt = Math.min(2, (now - t0) / 16.67);
      t0 = now;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = 0;
      for (var i = 0; i < parts.length; i++){
        var p = parts[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.012 * dpr * dt;
        p.rot += p.vr * dt;
        if (now - (p.born || 0) > 0) {}
        if (p.y < canvas.height + 40) alive++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, p.w * 0.35);
        ctx.fill();
        ctx.restore();
      }
      if (alive > 0 && !el("celebrate").hidden){
        confettiRaf = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiRaf = null;
      }
    }
    confettiRaf = requestAnimationFrame(frame);
  }
  function clearConfetti(){
    if (confettiRaf){ cancelAnimationFrame(confettiRaf); confettiRaf = null; }
    try { ctx.clearRect(0, 0, canvas.width, canvas.height); } catch(e){}
  }

  /* ====== 토스트 ====== */
  var toastEl = el("toast"), toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* ====== 화면 잠금/복귀 ====== */
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible"){
      if (state.running) requestWakeLock();
      render();
    }
  });

  /* ====== 버튼 ====== */
  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", function(){
    reset(true);
    toast("처음부터 다시 시작해요");
  });
  el("againBtn").addEventListener("click", function(){
    reset(true);
    setTimeout(start, 260);
  });

  /* ====== 소리 토글 ====== */
  var soundBtn = el("soundBtn");
  function paintSound(){
    soundBtn.textContent = state.settings.soundOn ? "🔔 소리 켜짐" : "🔕 소리 꺼짐";
    soundBtn.classList.toggle("on", state.settings.soundOn);
  }
  soundBtn.addEventListener("click", function(){
    state.settings.soundOn = !state.settings.soundOn;
    saveSettings(); paintSound(); paintSettings();
    if (state.settings.soundOn){ playSfx("pop"); toast("소리를 켰어요"); }
    else toast("소리를 껐어요");
  });

  /* ====== 설정 모달 ====== */
  var backdrop = el("settingsBackdrop");
  var minSegs = el("minSegs"), soundSegs = el("soundSegs");
  function paintSettings(){
    Array.prototype.forEach.call(minSegs.children, function(b){
      b.classList.toggle("sel", Number(b.dataset.min) === state.settings.minutes);
    });
    Array.prototype.forEach.call(soundSegs.children, function(b){
      b.classList.toggle("sel", (b.dataset.sound === "1") === state.settings.soundOn);
    });
  }
  function openSettings(){
    backdrop.hidden = false;
    paintSettings();
  }
  function closeSettings(){ backdrop.hidden = true; }

  el("settingsBtn").addEventListener("click", openSettings);
  el("closeSettings").addEventListener("click", closeSettings);
  backdrop.addEventListener("click", function(e){ if (e.target === backdrop) closeSettings(); });

  minSegs.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    var m = Number(b.dataset.min);
    if (!m || m === state.settings.minutes) return;
    state.settings.minutes = m;
    saveSettings(); paintSettings(); paintSound();
    reset(true);
    toast(m + "분 양치로 맞췄어요");
  });
  soundSegs.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    var on = b.dataset.sound === "1";
    if (on === state.settings.soundOn) return;
    state.settings.soundOn = on;
    saveSettings(); paintSettings(); paintSound();
    if (on) playSfx("pop");
    toast(on ? "소리를 켰어요" : "소리를 껐어요");
  });

  /* ====== 시작 ====== */
  loadSettings();
  paintSound();
  paintSettings();
  reset(true);
})();
</script>
</body>
</html>
